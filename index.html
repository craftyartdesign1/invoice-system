<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management System | Login</title>
    <style>
        :root { --primary: #000000; --bg: #f3f4f6; --white: #ffffff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
        body { background: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        .login-box { background: var(--white); width: 90%; max-width: 400px; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        h1 { margin-bottom: 1rem; font-size: 1.5rem; }
        input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 0.8rem; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #errorMessage { color: red; margin-top: 1rem; font-size: 0.9rem; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Crafty Art Design</h1>
        <p>Management Portal</p>
        <br>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleLogin()">Sign In</button>
        <div id="errorMessage">Invalid username or password.</div>
    </div>

    <script>
        const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const err = document.getElementById('errorMessage');

            if (!user || !pass) return;

            try {
                const response = await fetch(`${SCRIPT_URL}?action=login&username=${user}&password=${pass}`);
                const data = await response.json();

                if (data.success) {
                    alert("Login Successful! Welcome " + data.user.display_name);
                    // We will add the redirect to the dashboard here next
                } else {
                    err.style.display = 'block';
                }
            } catch (e) {
                console.error(e);
                alert("Connection error. Check your Apps Script URL.");
            }
        }
    </script>
</body>
</html>
