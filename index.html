<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD | NYC POS SYSTEM</title>
    <style>
        :root { --blue: #004080; --dark: #333; --light: #f4f7f6; --red: #e74c3c; --green: #28a745; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-color, var(--light)); background-size: cover; background-attachment: fixed; margin: 0; min-height: 100vh; }
        
        /* Header & Branding */
        .header-section { background: rgba(255,255,255,0.9); padding: 15px 30px; border-bottom: 4px solid var(--blue); display: flex; justify-content: space-between; align-items: center; }
        #logo-container img { max-height: 60px; }
        
        .nav-bar { display: flex; background: var(--dark); padding: 10px; gap: 10px; overflow-x: auto; }
        .tab { padding: 12px 20px; color: white; border: none; background: #555; cursor: pointer; border-radius: 4px; font-weight: bold; white-space: nowrap; }
        .tab.active { background: var(--blue); border-bottom: 3px solid gold; }

        .content { padding: 20px; max-width: 1400px; margin: auto; }
        .card { background: rgba(255,255,255,0.98); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); margin-bottom: 20px; }

        /* Tables */
        .pos-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .pos-table th { background: #f1f5f9; padding: 12px; text-align: left; border-bottom: 2px solid #ddd; }
        .pos-table td { padding: 10px; border-bottom: 1px solid #eee; }
        
        /* Buttons & Password Toggle */
        .btn { padding: 10px 20px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; }
        .btn-green { background: var(--green); }
        .btn-blue { background: #2563eb; }
        .btn-red { background: var(--red); }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        .pass-wrapper { position: relative; display: flex; align-items: center; }
        .eye-btn { position: absolute; right: 10px; cursor: pointer; background: none; border: none; font-size: 1.2rem; color: #666; }

        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 100%; }
        input:disabled { background-color: #f4f4f4; color: #777; }

        .total-display { text-align: right; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .grand-total { font-size: 2rem; font-weight: bold; color: var(--blue); }

        @media print { .nav-bar, .header-section, .btn-no-print, .action-col { display: none !important; } }
    </style>
</head>
<body>

<div class="header-section">
    <div id="logo-container"><h2 id="text-logo" style="margin:0;">CRAFTY ART DESIGN</h2></div>
    <div style="text-align: right;">
        <strong>User: <span id="displayUser">Alessio</span></strong><br>
        <button class="btn btn-blue btn-sm btn-no-print" onclick="toggleRole()" style="margin-top:5px; background:#666;">🛠️ Switch Role</button>
    </div>
</div>

<nav class="nav-bar">
    <button class="tab active" onclick="loadTab('Generator')">Invoice Generator</button>
    <button class="tab" onclick="loadTab('Lookup')">Invoice Lookup</button>
    <button class="tab" onclick="loadTab('Inventory')">Inventory</button>
    <button class="tab" onclick="loadTab('Customers')">Customers</button>
    <button id="adminTab" class="tab" onclick="loadTab('Settings')">⚙️ Admin Settings</button>
</nav>

<div class="content" id="mainView"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxNDPBFyPktfE46fGJg8PhZSH9q7_LBDDJDZ-SLyjo5Pd27PQxKyVCoARhZCoyr0MCc/exec";
    let inventory = [];
    let customers = [];
    let invoices = [];
    let managerPin = "1234";
    let currentUser = { name: 'Alessio', role: 'Admin' };
    let users = [{name: "Alessio", role: "Admin", pass: "admin123"}, {name: "Staff User", role: "Staff", pass: "staff456"}];

    window.onload = async () => {
        await refreshData();
        loadTab('Generator');
    };

    async function refreshData() {
        try {
            const [iRes, cRes, invRes] = await Promise.all([
                fetch(`${SCRIPT_URL}?action=getInventory`),
                fetch(`${SCRIPT_URL}?action=getCustomers`),
                fetch(`${SCRIPT_URL}?action=getInvoices`)
            ]);
            inventory = await iRes.json();
            customers = await cRes.json();
            invoices = await invRes.json();
        } catch(e) { console.error("Data Sync Error"); }
    }

    function toggleRole() {
        currentUser = (currentUser.role === 'Admin') ? users[1] : users[0];
        document.getElementById('displayUser').innerText = currentUser.name;
        document.getElementById('adminTab').style.display = (currentUser.role === 'Admin') ? 'block' : 'none';
        loadTab('Generator');
    }

    function loadTab(tabName) {
        const view = document.getElementById('mainView');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        
        if (tabName === 'Generator') { renderGenerator(view); }
        else if (tabName === 'Inventory' || tabName === 'Customers') { renderDataList(tabName, view); }
        else if (tabName === 'Settings') { renderAdminSettings(view); }
        else if (tabName === 'Lookup') { renderLookup(view); }
    }

    function togglePass(id) {
        const x = document.getElementById(id);
        x.type = (x.type === "password") ? "text" : "password";
    }

    function renderAdminSettings(view) {
        view.innerHTML = `
            <div class="card">
                <h3>Branding & Graphics</h3>
                <label>Update Logo:</label> <input type="file" accept="image/*" onchange="updateLogo(this)" style="margin-bottom:15px;">
                <label>Custom Background:</label> <input type="file" accept="image/*" onchange="updateBg(this)">
                <button class="btn btn-sm btn-red" onclick="document.body.style.backgroundImage='';">Reset White</button>

                <hr style="margin:30px 0;">

                <h3>Security & Manager Override</h3>
                <label>Set Manager PIN:</label>
                <div class="pass-wrapper" style="max-width:300px;">
                    <input type="password" id="pinInput" value="${managerPin}">
                    <button class="eye-btn" onclick="togglePass('pinInput')">👁️</button>
                </div>
                <button class="btn btn-blue btn-sm" style="margin-top:10px;" onclick="managerPin = document.getElementById('pinInput').value; alert('PIN Updated')">Save PIN</button>

                <hr style="margin:30px 0;">

                <h3>User Management</h3>
                <table class="pos-table">
                    <thead><tr><th>Name</th><th>Role</th><th>Password</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${users.map((u, i) => `
                            <tr>
                                <td><input type="text" value="${u.name}"></td>
                                <td><select><option ${u.role==='Admin'?'selected':''}>Admin</option><option ${u.role==='Staff'?'selected':''}>Staff</option></select></td>
                                <td>
                                    <div class="pass-wrapper">
                                        <input type="password" id="upass${i}" value="${u.pass}">
                                        <button class="eye-btn" onclick="togglePass('upass${i}')">👁️</button>
                                    </div>
                                </td>
                                <td><button class="btn btn-red btn-sm">Delete</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <button class="btn btn-blue btn-sm" style="margin-top:10px;">+ Add New User</button>
            </div>`;
    }

    function renderDataList(type, view) {
        const isAdmin = currentUser.role === 'Admin';
        let data = (type === 'Inventory' ? inventory : customers);
        
        let rows = data.map(r => `
            <tr>
                <td>${type === 'Inventory' ? r.SKU : r.Name}</td>
                <td>${type === 'Inventory' ? r["Item Name"] : r["Street Address"]}</td>
                <td>${type === 'Inventory' ? '$'+parseFloat(r.Price).toFixed(2) : (r.City || '---')}</td>
                <td class="action-col">
                    ${isAdmin ? `
                        <button class="btn btn-blue btn-sm" onclick="alert('Editing row')">Edit</button>
                        <button class="btn btn-red btn-sm" onclick="alert('Deleting row')">Delete</button>
                    ` : `<span style="color:#999;">Locked</span>`}
                </td>
            </tr>
        `).join('');

        view.innerHTML = `
            <div class="card">
                <h3>${type} Management</h3>
                <table class="pos-table">
                    <thead><tr><th>Key</th><th>Details</th><th>Info</th><th class="action-col">Actions</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
    }

    function renderLookup(view) {
        view.innerHTML = `
            <div class="card">
                <h3>Invoice History</h3>
                <table class="pos-table">
                    <thead><tr><th>Invoice #</th><th>Date</th><th>Customer</th><th>Amount</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${invoices.length > 0 ? invoices.map(inv => `
                            <tr>
                                <td>${inv["Invoice Number"]}</td>
                                <td>${inv.Date}</td>
                                <td>${inv.Customer}</td>
                                <td>$${parseFloat(inv.Total).toFixed(2)}</td>
                                <td><button class="btn btn-blue btn-sm" onclick="window.print()">Print Copy</button></td>
                            </tr>
                        `).join('') : '<tr><td colspan="5">No invoices found in records.</td></tr>'}
                    </tbody>
                </table>
            </div>`;
    }

    // Generator logic remains same for functionality
    function renderGenerator(view) {
        view.innerHTML = `
            <div class="card">
                <div style="display:flex; justify-content:space-between;">
                    <h3>New Invoice</h3>
                    <div>Date: ${new Date().toLocaleDateString()}</div>
                </div>
                <select id="posCustomer" style="margin-bottom:15px;"><option value="">Select Customer...</option>${customers.map(c=>`<option>${c.Name}</option>`).join('')}</select>
                <table class="pos-table"><tbody id="posBody"></tbody></table>
                <button class="btn btn-blue btn-sm btn-no-print" onclick="addRow()">+ Add Item</button>
                <div class="total-display">
                    <div class="grand-total">Total: <span id="grandDisp">$0.00</span></div>
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn btn-green btn-no-print" style="flex:1;" onclick="window.print()">PRINT</button>
                    <button class="btn btn-blue btn-no-print" style="flex:1;" onclick="alert('Saved to Sheet')">SAVE</button>
                </div>
            </div>`;
        addRow();
    }

    function addRow() {
        const isAdmin = currentUser.role === 'Admin';
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" placeholder="SKU" onchange="autoFill(this)"></td>
            <td><input type="text" placeholder="Item Name" ${!isAdmin ? 'disabled' : ''}></td>
            <td><input type="number" value="1" oninput="calcTotal()"></td>
            <td><input type="text" placeholder="0.00" oninput="calcTotal()" ${!isAdmin ? 'disabled' : ''}></td>
            <td class="row-total">$0.00</td>
            <td><button class="btn btn-red btn-sm" onclick="this.parentElement.parentElement.remove(); calcTotal();">X</button></td>`;
        document.getElementById('posBody').appendChild(tr);
    }

    function autoFill(input) {
        const item = inventory.find(i => String(i.SKU).toLowerCase() === input.value.toLowerCase());
        if(item) {
            const tr = input.closest('tr');
            tr.cells[1].children[0].value = item["Item Name"];
            tr.cells[3].children[0].value = item.Price;
            calcTotal();
        }
    }

    function calcTotal() {
        let total = 0;
        document.querySelectorAll('#posBody tr').forEach(tr => {
            const q = tr.cells[2].children[0].value;
            const p = tr.cells[3].children[0].value;
            const row = q * p;
            tr.cells[4].innerText = "$" + row.toFixed(2);
            total += row;
        });
        document.getElementById('grandDisp').innerText = "$" + (total * 1.08875).toFixed(2);
    }

    function updateLogo(input) {
        const reader = new FileReader();
        reader.onload = (e) => document.getElementById('logo-container').innerHTML = `<img src="${e.target.result}">`;
        reader.readAsDataURL(input.files[0]);
    }

    function updateBg(input) {
        const reader = new FileReader();
        reader.onload = (e) => document.body.style.backgroundImage = `url('${e.target.result}')`;
        reader.readAsDataURL(input.files[0]);
    }
</script>
</body>
</html>
