<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD | NYC POS SYSTEM - MASTER</title>
    <style>
        :root { --blue: #2563eb; --dark: #1e293b; --light: #f8fafc; --red: #ef4444; --green: #22c55e; --border: #e2e8f0; }
        * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: var(--light); margin: 0; padding-bottom: 50px; color: var(--dark); }

        /* Navigation */
        .top-nav { background: white; padding: 12px 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .nav-tabs { display: flex; background: white; border-bottom: 1px solid var(--border); padding: 0 40px; gap: 20px; }
        .tab { padding: 16px 10px; cursor: pointer; color: #64748b; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; transition: 0.2s; }
        .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
        .tab:hover { color: var(--blue); }

        /* Main Container */
        .container { max-width: 1200px; margin: 30px auto; background: white; padding: 35px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 20px; font-weight: 700; color: var(--dark); margin-bottom: 25px; }

        /* Grid Form Layout */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 35px; background: #f1f5f9; padding: 20px; border-radius: 8px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: border 0.2s; }
        input:focus { border-color: var(--blue); }
        input:disabled { background: #e2e8f0; color: #64748b; cursor: not-allowed; }

        /* Scanning/Search Area */
        .search-area { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .search-area .form-group { flex: 1; }

        /* Professional Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px; background: #f8fafc; border-bottom: 2px solid var(--border); font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; }
        td { padding: 14px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .exempt-badge { background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }

        /* Totals Area */
        .footer-flex { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 40px; padding-top: 25px; border-top: 2px solid #f1f5f9; }
        .price-box { font-size: 16px; line-height: 2; text-align: right; }
        .grand-total { font-size: 28px; font-weight: 800; color: var(--blue); margin-top: 10px; }

        /* Buttons */
        .btn { padding: 12px 24px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-blue:hover { background: #1d4ed8; }
        .btn-green { background: var(--green); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        @media print { 
            .top-nav, .nav-tabs, .btn, .search-area, th:last-child, td:last-child { display: none !important; }
            .container { box-shadow: none; border: none; margin: 0; padding: 0; width: 100%; }
            .form-grid { background: none; padding: 0; }
            input { border: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="top-nav">
    <h1 style="font-size: 20px; font-weight: 800; color: var(--blue); margin: 0;">CRAFTY ART DESIGN</h1>
    <div>
        <span style="font-weight: 600; margin-right: 15px;">User: <span id="userName">Alessio</span></span>
        <button class="btn btn-red btn-sm" onclick="location.reload()">Logout</button>
    </div>
</div>

<div class="nav-tabs">
    <div class="tab active" onclick="loadTab('Generator', event)">Invoice Generator</div>
    <div class="tab" onclick="loadTab('Inventory', event)">Inventory</div>
    <div class="tab" onclick="loadTab('Customers', event)">Customers</div>
    <div class="tab" onclick="loadTab('Lookup', event)">Invoice Lookup</div>
</div>

<div id="mainView" class="container">
    </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTLLbIZXmcXmepEyYpWE8XCbqD981bJZ1M2OTPNj4GS6FaObV1vJsLfZG1FmSlnlpG/exec";
    let inventory = [], customers = [], invoices = [];

    window.onload = async () => { 
        document.getElementById('mainView').innerHTML = "<h3>Loading System Data...</h3>";
        await refreshData(); 
        renderGenerator(); 
    };

    async function refreshData() {
        try {
            const [inv, cust, hist] = await Promise.all([
                fetch(`${SCRIPT_URL}?action=getInventory`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=getCustomers`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=getInvoices`).then(r => r.json())
            ]);
            inventory = inv; customers = cust; invoices = hist;
        } catch(e) { console.error("Sync Error:", e); }
    }

    function loadTab(tab, e) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        if (tab === 'Generator') renderGenerator();
        if (tab === 'Lookup') renderLookup();
        if (tab === 'Inventory') renderList('Inventory');
    }

    function renderGenerator(prefill = null) {
        const invNum = prefill ? prefill["Invoice Number"] : "INV-" + Math.floor(Math.random() * 900000 + 100000);
        const view = document.getElementById('mainView');
        view.innerHTML = `
            <h2>${prefill ? 'Review Invoice' : 'Create New Invoice'}</h2>
            <div class="form-grid">
                <div class="form-group"><label>Invoice Number</label><input type="text" id="invNum" value="${invNum}" disabled></div>
                <div class="form-group"><label>Date</label><input type="text" value="${new Date().toLocaleDateString()}" disabled></div>
                <div class="form-group"><label>Customer</label>
                    <select id="custName">
                        <option value="">Select Customer</option>
                        ${customers.map(c => `<option ${prefill && prefill.Customer === c.Name ? 'selected':''}>${c.Name}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group"><label>Employee</label><input type="text" id="empName" value="Alessio" disabled></div>
            </div>

            <div class="search-area">
                <div class="form-group"><label>Scan or Enter SKU</label><input type="text" id="skuInput" placeholder="Ex: CAD-101..." onkeypress="if(event.key==='Enter') addItemBySKU()"></div>
                <button class="btn btn-blue" onclick="addItemBySKU()">Add Item</button>
            </div>

            <table>
                <thead><tr><th>SKU</th><th>Item Description</th><th>Qty</th><th>Price</th><th>Tax</th><th>Total</th><th class="btn-no-print">Action</th></tr></thead>
                <tbody id="invoiceBody"></tbody>
            </table>

            <div class="footer-flex">
                <div class="btn-no-print">
                    <button class="btn btn-green" onclick="saveInvoice()">Save & Sync</button>
                    <button class="btn btn-blue" style="margin-left:10px;" onclick="window.print()">Print Invoice</button>
                </div>
                <div class="price-box">
                    Subtotal: <span id="subTotal">$0.00</span><br>
                    NYC Sales Tax (8.875%): <span id="taxTotal">$0.00</span>
                    <div class="grand-total">Total: <span id="grandTotal">$0.00</span></div>
                </div>
            </div>`;
        if(prefill && prefill.Items) {
            JSON.parse(prefill.Items).forEach(item => addRowToTable(item));
        }
    }

    function addItemBySKU() {
        const sku = document.getElementById('skuInput').value.trim();
        const item = inventory.find(i => String(i.SKU).toLowerCase() === sku.toLowerCase());
        if(!item) return alert("SKU Not Found");
        addRowToTable(item);
        document.getElementById('skuInput').value = "";
    }

    function addRowToTable(item) {
        const isExempt = item["Tax Exempt"] === true || item["Tax Exempt"] === "TRUE";
        const tr = document.createElement('tr');
        tr.setAttribute('data-exempt', isExempt);
        tr.innerHTML = `
            <td>${item.SKU}</td>
            <td><strong>${item["Item Name"]}</strong></td>
            <td><input type="number" value="${item.Qty || 1}" min="1" style="width:60px" oninput="calculate()"></td>
            <td>$${parseFloat(item.Price).toFixed(2)}</td>
            <td>${isExempt ? '<span class="exempt-badge">EXEMPT</span>' : '8.875%'}</td>
            <td class="row-total">$0.00</td>
            <td><button class="btn btn-red btn-sm" onclick="this.closest('tr').remove(); calculate()">Delete</button></td>`;
        document.getElementById('invoiceBody').appendChild(tr);
        calculate();
    }

    function calculate() {
        let sub = 0, taxable = 0;
        document.querySelectorAll('#invoiceBody tr').forEach(tr => {
            const qty = tr.cells[2].querySelector('input').value;
            const price = tr.cells[3].innerText.replace('$','');
            const total = qty * price;
            tr.cells[5].innerText = "$" + total.toFixed(2);
            sub += total;
            if(tr.getAttribute('data-exempt') !== 'true') taxable += total;
        });
        const tax = taxable * 0.08875;
        document.getElementById('subTotal').innerText = "$" + sub.toFixed(2);
        document.getElementById('taxTotal').innerText = "$" + tax.toFixed(2);
        document.getElementById('grandTotal').innerText = "$" + (sub + tax).toFixed(2);
    }

    async function saveInvoice() {
        const items = [];
        document.querySelectorAll('#invoiceBody tr').forEach(tr => {
            items.push({
                SKU: tr.cells[0].innerText,
                Name: tr.cells[1].innerText,
                Qty: tr.cells[2].querySelector('input').value,
                Price: tr.cells[3].innerText.replace('$',''),
                TaxExempt: tr.getAttribute('data-exempt')
            });
        });

        const data = {
            action: 'save',
            invoiceNumber: document.getElementById('invNum').value,
            customer: document.getElementById('custName').value,
            date: new Date().toLocaleDateString(),
            total: document.getElementById('grandTotal').innerText.replace('$',''),
            items: JSON.stringify(items)
        };

        alert("Saving to Google Sheets...");
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
        alert("Invoice Recorded!");
        refreshData();
    }

    function renderLookup() {
        document.getElementById('mainView').innerHTML = `
            <h2>Invoice History</h2>
            <table>
                <thead><tr><th>Inv #</th><th>Date</th><th>Customer</th><th>Total Amount</th><th>Actions</th></tr></thead>
                <tbody>
                    ${invoices.map(inv => `
                        <tr>
                            <td>${inv["Invoice Number"]}</td>
                            <td>${inv.Date}</td>
                            <td>${inv.Customer}</td>
                            <td><strong>$${parseFloat(inv.Total || 0).toFixed(2)}</strong></td>
                            <td>
                                <button class="btn btn-blue btn-sm" onclick='reprintInv(${JSON.stringify(inv)})'>View/Print</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>`;
    }

    function reprintInv(inv) {
        renderGenerator(inv);
        setTimeout(() => calculate(), 100);
    }
</script>
</body>
</html>
