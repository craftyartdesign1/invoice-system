<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD | NYC POS SYSTEM</title>
    <style>
        :root { --blue: #004080; --dark: #333; --light: #f4f7f6; --red: #e74c3c; --green: #28a745; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-color, white); background-size: cover; margin: 0; }
        
        .header-section { background: white; padding: 15px 30px; border-bottom: 4px solid var(--blue); display: flex; justify-content: space-between; align-items: center; }
        #logo-container img { max-height: 60px; }
        
        .nav-bar { display: flex; background: var(--dark); padding: 10px; gap: 10px; overflow-x: auto; }
        .tab { padding: 12px 20px; color: white; border: none; background: #555; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .tab.active { background: var(--blue); border-bottom: 3px solid #ffd700; }

        .content { padding: 20px; max-width: 1200px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }

        .pos-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .pos-table th { background: #f8fafc; padding: 12px; text-align: left; border-bottom: 2px solid #ddd; font-size: 0.9rem; }
        .pos-table td { padding: 12px; border-bottom: 1px solid #eee; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; }
        .btn-green { background: var(--green); }
        .btn-blue { background: #2563eb; }
        .btn-red { background: var(--red); }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        
        .pass-wrapper { position: relative; display: flex; align-items: center; max-width: 300px; }
        .eye-btn { position: absolute; right: 10px; cursor: pointer; background: none; border: none; }

        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 100%; }
        .total-area { text-align: right; margin-top: 20px; line-height: 1.6; }
        .grand-total { font-size: 2.2rem; font-weight: bold; color: var(--blue); }

        @media print { 
            .nav-bar, .header-section, .btn-no-print, .action-col, #adminTab { display: none !important; } 
            .card { box-shadow: none; border: none; padding: 0; margin: 0; }
            body { background: white !important; }
        }
    </style>
</head>
<body>

<div class="header-section">
    <div id="logo-container"><h2 style="margin:0;">CRAFTY ART DESIGN</h2></div>
    <div style="text-align: right;">
        <strong>User: <span id="displayUser">Alessio</span></strong><br>
        <button class="btn btn-blue btn-sm btn-no-print" onclick="toggleRole()" style="margin-top:5px; background:#666;">🛠️ Switch Role</button>
    </div>
</div>

<nav class="nav-bar">
    <button class="tab active" onclick="loadTab('Generator')">Invoice Generator</button>
    <button class="tab" onclick="loadTab('Lookup')">Invoice Lookup</button>
    <button class="tab" onclick="loadTab('Inventory')">Inventory</button>
    <button class="tab" onclick="loadTab('Customers')">Customers</button>
    <button id="adminTab" class="tab" onclick="loadTab('Settings')">⚙️ Admin Settings</button>
</nav>

<div class="content" id="mainView"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxNDPBFyPktfE46fGJg8PhZSH9q7_LBDDJDZ-SLyjo5Pd27PQxKyVCoARhZCoyr0MCc/exec";
    const TAX_RATE = 0.08875;
    let inventory = [], customers = [], invoices = [];
    let managerPin = "1234";
    let currentUser = { name: 'Alessio', role: 'Admin' };
    let users = [{name: "Alessio", role: "Admin", pass: "admin123"}, {name: "Staff", role: "Staff", pass: "staff456"}];

    window.onload = async () => { await refreshData(); loadTab('Generator'); };

    async function refreshData() {
        try {
            const [i, c, inv] = await Promise.all([
                fetch(`${SCRIPT_URL}?action=getInventory`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=getCustomers`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=getInvoices`).then(r => r.json())
            ]);
            inventory = i.filter(row => row.SKU); // Filter out blank rows
            customers = c.filter(row => row.Name);
            invoices = inv.filter(row => row["Invoice Number"]);
        } catch(e) { console.log("Sync Error"); }
    }

    function toggleRole() {
        currentUser = (currentUser.role === 'Admin') ? users[1] : users[0];
        document.getElementById('displayUser').innerText = currentUser.name;
        document.getElementById('adminTab').style.display = (currentUser.role === 'Admin') ? 'block' : 'none';
        loadTab('Generator');
    }

    function togglePass(id) {
        const x = document.getElementById(id);
        x.type = (x.type === "password") ? "text" : "password";
    }

    function loadTab(name) {
        const view = document.getElementById('mainView');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        const activeTab = Array.from(document.querySelectorAll('.tab')).find(t => t.innerText.includes(name));
        if(activeTab) activeTab.classList.add('active');

        if (name === 'Generator') {
            const invNum = "INV-" + Math.floor(100000 + Math.random() * 900000);
            view.innerHTML = `
                <div class="card" id="invoiceArea">
                    <div style="display:flex; justify-content:space-between;">
                        <div><h2>INVOICE</h2><strong># ${invNum}</strong></div>
                        <div style="text-align:right;">Date: ${new Date().toLocaleDateString()}</div>
                    </div>
                    <select id="posCustomer" style="margin:20px 0;"><option value="">Select Customer...</option>${customers.map(c=>`<option>${c.Name}</option>`).join('')}</select>
                    <table class="pos-table">
                        <thead><tr><th>SKU</th><th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th class="btn-no-print"></th></tr></thead>
                        <tbody id="posBody"></tbody>
                    </table>
                    <button class="btn btn-blue btn-sm btn-no-print" onclick="addRow()" style="margin-top:10px;">+ Add Item</button>
                    <div class="total-area">
                        Subtotal: <span id="subTotal">$0.00</span><br>
                        NYC Tax (8.875%): <span id="taxTotal">$0.00</span>
                        <div class="grand-total">Total: <span id="grandDisp">$0.00</span></div>
                    </div>
                    <div style="display:flex; gap:10px; margin-top:20px;" class="btn-no-print">
                        <button class="btn btn-green" style="flex:1;" onclick="window.print()">PRINT INVOICE</button>
                        <button class="btn btn-blue" style="flex:1;" onclick="alert('Saved')">SAVE RECORD</button>
                    </div>
                </div>`;
            addRow();
        } 
        else if (name === 'Lookup') {
            view.innerHTML = `
                <div class="card">
                    <h3>Invoice Lookup</h3>
                    <table class="pos-table">
                        <thead><tr><th>Invoice #</th><th>Date</th><th>Customer</th><th>Company</th><th>Employee</th><th class="action-col">Actions</th></tr></thead>
                        <tbody>${invoices.map(inv => `
                            <tr>
                                <td>${inv["Invoice Number"]}</td>
                                <td>${inv.Date}</td>
                                <td>${inv.Customer}</td>
                                <td>${inv.Company || 'N/A'}</td>
                                <td>${inv.Employee}</td>
                                <td class="action-col"><button class="btn btn-blue btn-sm" onclick="window.print()">Print</button></td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
        }
        else if (name === 'Inventory' || name === 'Customers') {
            const isAdmin = currentUser.role === 'Admin';
            let data = (name === 'Inventory' ? inventory : customers);
            view.innerHTML = `
                <div class="card">
                    <h3>${name} Database</h3>
                    <table class="pos-table">
                        <thead><tr>
                            <th>${name === 'Inventory' ? 'SKU' : 'Name'}</th>
                            <th>${name === 'Inventory' ? 'Item Name' : 'Street Address'}</th>
                            <th>${name === 'Inventory' ? 'Price' : 'City'}</th>
                            <th class="action-col">Actions</th>
                        </tr></thead>
                        <tbody>${data.map(r => `
                            <tr>
                                <td>${name === 'Inventory' ? r.SKU : r.Name}</td>
                                <td>${name === 'Inventory' ? r["Item Name"] : (r["Street Address"] || '---')}</td>
                                <td>${name === 'Inventory' ? '$'+parseFloat(r.Price || 0).toFixed(2) : (r.City || '---')}</td>
                                <td class="action-col">
                                    <button class="btn btn-blue btn-sm" ${!isAdmin?'style="display:none"':''}>Edit</button>
                                    <button class="btn btn-red btn-sm" ${!isAdmin?'style="display:none"':''}>Delete</button>
                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
        }
        else if (name === 'Settings') {
            view.innerHTML = `
                <div class="card">
                    <h3>Security & Users</h3>
                    <label>Manager PIN:</label>
                    <div class="pass-wrapper"><input type="password" id="mPin" value="${managerPin}"><button class="eye-btn" onclick="togglePass('mPin')">👁️</button></div>
                    <hr style="margin:20px 0;">
                    <h3>Manage Team</h3>
                    <table class="pos-table">
                        ${users.map((u,i)=>`<tr><td>${u.name}</td><td>${u.role}</td>
                        <td><div class="pass-wrapper"><input type="password" id="uPass${i}" value="${u.pass}"><button class="eye-btn" onclick="togglePass('uPass${i}')">👁️</button></div></td></tr>`).join('')}
                    </table>
                </div>`;
        }
    }

    function addRow() {
        const isAdmin = currentUser.role === 'Admin';
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" onchange="autoFill(this)" placeholder="SKU"></td>
            <td><input type="text" ${!isAdmin?'disabled':''}></td>
            <td><input type="number" value="1" min="1" oninput="calcTotal()"></td>
            <td><input type="text" ${!isAdmin?'disabled':''}></td>
            <td class="row-total">$0.00</td>
            <td class="btn-no-print"><button class="btn btn-red btn-sm" onclick="this.parentElement.parentElement.remove(); calcTotal();">X</button></td>`;
        document.getElementById('posBody').appendChild(tr);
    }

    function autoFill(input) {
        const item = inventory.find(i => String(i.SKU).toLowerCase() === input.value.toLowerCase());
        if(item) {
            const tr = input.closest('tr');
            tr.cells[1].children[0].value = item["Item Name"];
            tr.cells[3].children[0].value = item.Price;
            calcTotal();
        }
    }

    function calcTotal() {
        let sub = 0;
        document.querySelectorAll('#posBody tr').forEach(tr => {
            const q = parseFloat(tr.cells[2].children[0].value) || 0;
            const p = parseFloat(tr.cells[3].children[0].value) || 0;
            const rowSum = q * p;
            tr.cells[4].innerText = "$" + rowSum.toFixed(2);
            sub += rowSum;
        });
        const tax = sub * TAX_RATE;
        document.getElementById('subTotal').innerText = "$" + sub.toFixed(2);
        document.getElementById('taxTotal').innerText = "$" + tax.toFixed(2);
        document.getElementById('grandDisp').innerText = "$" + (sub + tax).toFixed(2);
    }
</script>
</body>
</html>
