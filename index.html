<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafty Art Design | Management System</title>
    <style>
        :root { --primary: #000000; --bg: #f3f4f6; --white: #ffffff; --text: #1f2937; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        
        #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        #mainApp { display: none; }

        .login-box { background: var(--white); width: 90%; max-width: 400px; padding: 2.5rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        header { background: var(--white); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-tabs { display: flex; background: #e5e7eb; padding: 10px 20px; gap: 10px; }
        .tab-btn { padding: 8px 15px; cursor: pointer; border: none; background: #f3f4f6; border-radius: 5px; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        .content-area { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
        .card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        th { background: #f8fafc; text-align: left; padding: 10px; border-bottom: 2px solid #e2e8f0; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        
        .form-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; }
        input, select { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
        .btn-primary { width: 100%; padding: 0.8rem; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        #invoiceModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 2rem; border-radius: 15px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h1>Crafty Art Design</h1>
            <p style="color: #666; margin-bottom: 1.5rem;">Management Portal</p>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class="btn-primary" onclick="handleLogin()">Sign In</button>
        </div>
    </div>

    <div id="mainApp">
        <header>
            <h2>Crafty Art Design</h2>
            <div>Welcome, <span id="userDisplay" style="font-weight: bold;">User</span> | <a href="#" onclick="location.reload()">Logout</a></div>
        </header>

        <nav class="nav-tabs">
            <button class="tab-btn" id="tab0" onclick="showDashboard()">Dashboard</button>
            <button class="tab-btn" id="tab1" onclick="loadInventory()">Inventory</button>
            <button class="tab-btn active" id="tab2" onclick="loadInvoices()">Invoices</button>
        </nav>

        <div class="content-area" id="pageContent"></div>
    </div>

    <div id="invoiceModal">
        <div class="modal-content">
            <h3>Create New Invoice</h3>
            <hr style="margin: 15px 0;">
            <div class="form-group">
                <label>Invoice Number</label>
                <input type="text" id="invNum" placeholder="INV-001">
            </div>
            <div class="form-group">
                <label>Select Customer</label>
                <select id="invCustSelect" onchange="autoFillCompany()">
                    <option value="">-- Loading Customers... --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Company</label>
                <input type="text" id="invComp" readonly style="background: #f3f4f6;" placeholder="Auto-filled">
            </div>
            <div class="form-group">
                <label>Subtotal ($)</label>
                <input type="number" id="invSub" value="0.00" step="0.01">
            </div>
            <div class="form-group">
                <label>Tax ($)</label>
                <input type="number" id="invTax" value="0.00" step="0.01">
            </div>
            <button class="btn-primary" id="saveBtn" onclick="saveInvoice()">Save to Sheets</button>
            <button class="btn-primary" style="background:#666; margin-top:10px;" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzhD4oNy5mqhC5JqFjKoDDL_ck3QijDXMy2Rzsnx4fumv1AkoqJ6FDo_mzJNrs8J8fg/exec";
        let currentUser = "";
        let globalCustomers = [];

        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            try {
                const response = await fetch(`${SCRIPT_URL}?action=login&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
                const data = await response.json();
                if (data.success) {
                    currentUser = data.user.display_name;
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                    document.getElementById('userDisplay').innerText = currentUser;
                    showDashboard();
                } else { alert("Invalid Login"); }
            } catch (e) { alert("Connection Error"); }
        }

        function updateTabs(index) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
        }

        function showDashboard() {
            updateTabs(0);
            document.getElementById('pageContent').innerHTML = `<div class="card"><h3>Dashboard</h3><p>Welcome, ${currentUser}. System connected to Sheets.</p></div>`;
        }

        async function loadInventory() {
            updateTabs(1);
            const container = document.getElementById('pageContent');
            container.innerHTML = '<div class="card"><h3>Loading Inventory...</h3></div>';
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getInventory`);
                const data = await response.json();
                let html = `<div class="card"><h3>Inventory</h3><table><thead><tr><th>SKU</th><th>Item Name</th><th>Price</th><th>Size</th></tr></thead><tbody>`;
                data.forEach(item => {
                    html += `<tr><td>${item.sku||''}</td><td>${item.item_name||''}</td><td>$${item.price||''}</td><td>${item.size||''}</td></tr>`;
                });
                container.innerHTML = html + `</tbody></table></div>`;
            } catch (e) { container.innerHTML = "Error loading inventory."; }
        }

        async function loadInvoices() {
            updateTabs(2);
            const container = document.getElementById('pageContent');
            container.innerHTML = '<div class="card"><h3>Loading Invoices...</h3></div>';
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getInvoices`);
                const data = await response.json();
                let html = `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                            <h3>Invoices</h3>
                            <button class="btn-primary" style="width:auto; padding: 8px 20px;" onclick="openModal()">+ New Invoice</button>
                        </div>
                        <div style="overflow-x:auto;">
                        <table>
                            <thead><tr><th>Inv #</th><th>Date</th><th>Customer</th><th>Company</th><th>Total</th></tr></thead>
                            <tbody>`;
                data.forEach(inv => {
                    html += `<tr><td>${inv.invoice_number||''}</td><td>${inv.date ? new Date(inv.date).toLocaleDateString() : ''}</td><td>${inv.customer||''}</td><td>${inv.company||''}</td><td><strong>$${inv.total||'0.00'}</strong></td></tr>`;
                });
                container.innerHTML = html + `</tbody></table></div></div>`;
            } catch (e) { container.innerHTML = "Error loading invoices."; }
        }

        async function openModal() {
            document.getElementById('invoiceModal').style.display = 'flex';
            const select = document.getElementById('invCustSelect');
            select.innerHTML = '<option value="">-- Loading... --</option>';

            try {
                const response = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                globalCustomers = await response.json();
                
                select.innerHTML = '<option value="">-- Choose a Customer --</option>';
                globalCustomers.forEach(c => {
                    let opt = document.createElement('option');
                    opt.value = c.name; // Based on your 'Name' header
                    opt.innerText = c.name;
                    select.appendChild(opt);
                });
            } catch (e) { select.innerHTML = '<option value="">Error loading customers</option>'; }
        }

        function autoFillCompany() {
            const val = document.getElementById('invCustSelect').value;
            const found = globalCustomers.find(c => c.name === val);
            document.getElementById('invComp').value = found ? found.company : '';
        }

        function closeModal() { document.getElementById('invoiceModal').style.display = 'none'; }

        async function saveInvoice() {
            const saveBtn = document.getElementById('saveBtn');
            const sub = parseFloat(document.getElementById('invSub').value) || 0;
            const tax = parseFloat(document.getElementById('invTax').value) || 0;
            
            const payload = {
                invoice_number: document.getElementById('invNum').value,
                customer: document.getElementById('invCustSelect').value,
                company: document.getElementById('invComp').value,
                employee: currentUser,
                subtotal: sub,
                tax: tax,
                total: (sub + tax).toFixed(2)
            };

            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            try {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                alert("Invoice Sent to Sheet!");
                closeModal();
                loadInvoices();
            } catch (e) { alert("Error saving."); }
            finally { saveBtn.innerText = "Save to Sheets"; saveBtn.disabled = false; }
        }
    </script>
</body>
</html>
