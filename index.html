<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFTY ART DESIGN | MASTER POS</title>
    <style>
        :root { --blue: #004d73; --bg: #f1f5f9; --white: #ffffff; --green: #10b981; --red: #ef4444; --gray: #64748b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; overflow-x: hidden; }
        
        /* NAVIGATION */
        .navbar { background: var(--blue); color: white; padding: 0 20px; height: 70px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .nav-links { display: flex; height: 100%; }
        .nav-links div { padding: 0 15px; display: flex; align-items: center; cursor: pointer; font-weight: 600; opacity: 0.7; border-bottom: 3px solid transparent; }
        .active-tab { opacity: 1 !important; border-bottom: 3px solid white !important; background: rgba(255,255,255,0.1); }

        .container { max-width: 1400px; margin: 25px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .hidden { display: none !important; }

        /* TABLES */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th { text-align: left; padding: 15px; color: var(--blue); font-size: 0.8rem; text-transform: uppercase; border-bottom: 2px solid #edf2f7; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }

        /* MODAL / POPUP STYLES */
        .modal { position: fixed; z-index: 2000; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 450px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid #ccc; display: none; }
        .modal-header { background: var(--blue); color: white; padding: 15px; border-radius: 12px 12px 0 0; cursor: move; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; max-height: 80vh; overflow-y: auto; }
        
        /* FORM STYLING */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; font-weight: bold; color: var(--gray); margin-bottom: 5px; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: var(--blue); color: white; text-transform: uppercase; font-size: 11px; }
        .btn-green { background: var(--green); }
        .btn-red { background: var(--red); }
        .custom-dim { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="navbar">
    <div style="font-weight:900; font-size: 1.3rem;">CRAFTY ART DESIGN</div>
    <div class="nav-links">
        <div id="tabGen" class="active-tab" onclick="switchTab('Gen')">NEW SALE</div>
        <div id="tabInv" onclick="switchTab('Inv')">INVENTORY</div>
        <div id="tabCust" onclick="switchTab('Cust')">CUSTOMERS</div>
        <div id="tabLook" onclick="switchTab('Look')">INVOICE LOOKUP</div>
        <div id="tabAdm" onclick="switchTab('Adm')">ADMIN SUITE</div>
    </div>
</div>

<div class="container">
    <div id="viewGen" class="card"><h3>New Sale</h3><p id="syncStatus">Syncing...</p></div>

    <div id="viewInv" class="hidden card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Inventory Management</h2>
            <button class="btn btn-green" onclick="showModal('invModal')">+ Add New Item</button>
        </div>
        <table>
            <thead><tr><th>SKU</th><th>Item Name</th><th>Size</th><th>Price</th><th>Actions</th></tr></thead>
            <tbody id="invBody"></tbody>
        </table>
    </div>

    <div id="viewCust" class="hidden card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Customer Database</h2>
            <button class="btn btn-green" onclick="showModal('custModal')">+ Add New Customer</button>
        </div>
        <table>
            <thead><tr><th>Name</th><th>Company</th><th>Address</th><th>Contact</th><th>Actions</th></tr></thead>
            <tbody id="custBody"></tbody>
        </table>
    </div>

    <div id="viewLook" class="hidden card"><h2>Invoice Lookup</h2></div>

    <div id="viewAdm" class="hidden">
        <div class="card"><h3>Store Branding</h3></div>
        <div class="card">
            <h3>Tax Archive</h3>
            <select style="width:200px;"><option>2024 Report</option><option>2025 Report</option></select>
            <button class="btn">Download PDF</button>
        </div>
        <div class="card"><h3>User Management</h3></div>
    </div>
</div>

<div id="invModal" class="modal">
    <div class="modal-header"><span>Add New Item</span><span onclick="closeModal('invModal')" style="cursor:pointer">×</span></div>
    <div class="modal-body">
        <div class="form-group"><label>SKU</label><input type="text"></div>
        <div class="form-group"><label>Item Name</label><input type="text"></div>
        <div class="form-group"><label>Price ($)</label><input type="number" step="0.01" placeholder="0.00"></div>
        <div class="form-group">
            <label>Size Selection</label>
            <select id="sizeSelect" onchange="toggleCustomSize()">
                <option value="XS">XS</option><option value="S">S</option><option value="M">M</option>
                <option value="L">L</option><option value="XL">XL</option><option value="2XL">2XL</option>
                <option value="3XL">3XL</option><option value="4XL">4XL</option><option value="5XL">5XL</option>
                <option value="Custom">Custom Size...</option>
            </select>
        </div>
        <div id="customSizeBox" class="custom-dim hidden">
            <div><label>Width (in)</label><input type="number" placeholder="0"></div>
            <div><label>Height (in)</label><input type="number" placeholder="0"></div>
        </div>
        <button class="btn btn-green" style="width:100%; margin-top:20px;">Save Item to Inventory</button>
    </div>
</div>

<div id="custModal" class="modal">
    <div class="modal-header"><span>Add New Customer</span><span onclick="closeModal('custModal')" style="cursor:pointer">×</span></div>
    <div class="modal-body">
        <div class="form-group"><label>Full Name</label><input type="text"></div>
        <div class="form-group"><label>Company (Optional)</label><input type="text"></div>
        <div class="form-group"><label>Street Address</label><input type="text"></div>
        <div class="flex-row">
            <div><label>City</label><input type="text"></div>
            <div><label>State</label>
                <select><option>NY</option><option>CA</option><option>TX</option><option>FL</option></select>
            </div>
            <div><label>Zip Code</label><input type="text"></div>
        </div>
        <div class="form-group"><label>Email Address</label><input type="email"></div>
        <div class="form-group"><label>Phone Number</label><input type="tel"></div>
        <button class="btn btn-green" style="width:100%; margin-top:10px;">Save Customer</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw99ETCoDFnyumicuEBn-MXsqjG7foGZTn2uE0x0lDK6MmvuDAcrJ0-B2tP6xfJWYy9/exec";

    window.onload = loadData;

    async function loadData() {
        try {
            const [invRes, custRes] = await Promise.all([
                fetch(`${SCRIPT_URL}?action=getInventory`),
                fetch(`${SCRIPT_URL}?action=getCustomers`)
            ]);
            const inv = await invRes.json();
            const cust = await custRes.json();
            
            document.getElementById('invBody').innerHTML = inv.filter(i => i.SKU).map(i => `
                <tr><td>${i.SKU}</td><td>${i["Item Name"]}</td><td>${i.Size || ''}</td>
                <td>$${parseFloat(i.Price || 0).toFixed(2)}</td>
                <td><button class="btn btn-red" style="padding:4px 8px">DEL</button></td></tr>`).join('');

            document.getElementById('custBody').innerHTML = cust.filter(c => c.Name).map(c => `
                <tr><td>${c.Name}</td><td>${c.Company || '--'}</td>
                <td>${c["Street Address"]}, ${c.City}</td><td>${c.Email || c.Phone}</td>
                <td><button class="btn btn-red" style="padding:4px 8px">DEL</button></td></tr>`).join('');
            
            document.getElementById('syncStatus').innerText = "Live Sync Active";
        } catch(e) { document.getElementById('syncStatus').innerText = "Sync Error: Verify Script"; }
    }

    function switchTab(t) {
        document.querySelectorAll('.nav-links div').forEach(el => el.classList.remove('active-tab'));
        document.getElementById('tab'+t).classList.add('active-tab');
        ['viewGen', 'viewInv', 'viewCust', 'viewLook', 'viewAdm'].forEach(v => document.getElementById(v).classList.add('hidden'));
        document.getElementById('view' + t).classList.remove('hidden');
    }

    function showModal(id) { document.getElementById(id).style.display = 'block'; dragElement(document.getElementById(id)); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleCustomSize() {
        const isCustom = document.getElementById('sizeSelect').value === 'Custom';
        document.getElementById('customSizeBox').classList.toggle('hidden', !isCustom);
    }

    // DRAGGABLE LOGIC
    function dragElement(elmnt) {
        var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        const header = elmnt.querySelector(".modal-header");
        if (header) { header.onmousedown = dragMouseDown; }
        function dragMouseDown(e) { e.preventDefault(); pos3 = e.clientX; pos4 = e.clientY; document.onmouseup = closeDragElement; document.onmousemove = elementDrag; }
        function elementDrag(e) { e.preventDefault(); pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY; pos3 = e.clientX; pos4 = e.clientY; elmnt.style.top = (elmnt.offsetTop - pos2) + "px"; elmnt.style.left = (elmnt.offsetLeft - pos1) + "px"; }
        function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }
    }
</script>
</body>
</html>
