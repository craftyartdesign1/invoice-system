<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftyArt Management System</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f7f9;color:#333}
        .header-top{background:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e0e6ed}
        .tabs{background:#fff;display:flex;padding:0 2rem;border-bottom:1px solid #e0e6ed;overflow-x:auto}
        .tab{padding:1rem 1.25rem;border:none;background:none;cursor:pointer;font-weight:500;color:#64748b;border-bottom:3px solid transparent;white-space:nowrap}
        .tab.active{color:#3b82f6;border-bottom-color:#3b82f6}
        .content{padding:2rem;max-width:1200px;margin:0 auto}
        .card{background:#fff;padding:1.5rem;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,0.05);margin-bottom:2rem}
        .hidden{display:none}
        .form-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:1rem;margin-bottom:1rem}
        .form-group label{display:block;font-size:0.8rem;margin-bottom:0.4rem;font-weight:600;color:#475569}
        .form-group input, .form-group select{width:100%;padding:0.6rem;border:1px solid #cbd5e1;border-radius:6px;font-size:0.9rem}
        table{width:100%;border-collapse:collapse;margin-top:1rem}
        th{text-align:left;background:#f8fafc;padding:0.8rem;border-bottom:2px solid #e2e8f0;font-size:0.7rem;text-transform:uppercase;color:#64748b}
        td{padding:0.8rem;border-bottom:1px solid #f1f5f9;font-size:0.9rem}
        .btn{padding:0.6rem 1.2rem;border-radius:6px;border:none;cursor:pointer;font-weight:600;transition:0.2s}
        .btn-blue{background:#3b82f6;color:#fff}
        .btn-green{background:#10b981;color:#fff}
        .btn-red{background:#ef4444;color:#fff}
        .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#3b82f6}
        .login-box{background:#fff;padding:2.5rem;border-radius:12px;width:380px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.1)}
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h2 style="margin-bottom:1.5rem; color:#1e3a8a">System Login</h2>
        <input type="text" id="username" placeholder="Username" style="width:100%;padding:0.8rem;margin-bottom:1rem;border:1px solid #ddd;border-radius:6px">
        <input type="password" id="password" placeholder="Password" style="width:100%;padding:0.8rem;margin-bottom:1.5rem;border:1px solid #ddd;border-radius:6px">
        <div id="loginError" style="color:red;margin-bottom:1rem;font-size:0.85rem;min-height:1.2rem"></div>
        <button class="btn btn-blue" style="width:100%" id="signInBtn" onclick="login()">Sign In</button>
    </div>
</div>

<div id="mainApp" class="hidden">
    <div class="header-top">
        <h1 style="color:#1e3a8a">CraftyArt Design</h1>
        <button class="btn btn-red" onclick="location.reload()">Logout</button>
    </div>
    
    <div class="tabs">
        <button class="tab active" onclick="showTab('invoice',event)">Invoices</button>
        <button class="tab" onclick="showTab('inventory',event)">Inventory</button>
        <button class="tab" onclick="showTab('customers',event)">Customers</button>
        <button id="adminTabBtn" class="tab" onclick="showTab('admin',event)">Admin</button>
    </div>

    <div class="content">
        <div id="invoice" class="card">
            <h2>Invoice Generator</h2>
            <div class="form-grid" style="margin-top:1.5rem">
                <div class="form-group"><label>Invoice #</label><input type="text" value="INV-1001" readonly></div>
                <div class="form-group"><label>Date</label><input type="date" id="invDate"></div>
                <div class="form-group"><label>Customer</label><select id="invCustSelect"><option>Select Customer</option></select></div>
            </div>
            <p style="color:#64748b; font-size:0.9rem">Invoice items and printing logic are ready for setup.</p>
        </div>

        <div id="inventory" class="card hidden">
            <h2>Inventory Management</h2>
            <div class="form-grid">
                <div class="form-group"><label>SKU</label><input type="text" id="invSKU"></div>
                <div class="form-group"><label>Item Name</label><input type="text" id="invItem"></div>
                <div class="form-group"><label>Price ($)</label><input type="number" id="invPrice" step="0.01"></div>
            </div>
            <button class="btn btn-blue" onclick="saveToSheet('Inventory')">Add Item</button>
        </div>

        <div id="customers" class="card hidden">
            <h2>Customer Database</h2>
            <div class="form-grid">
                <div class="form-group"><label>Name</label><input type="text" id="custName"></div>
                <div class="form-group"><label>Email</label><input type="email" id="custEmail"></div>
                <div class="form-group"><label>Phone</label><input type="text" id="custPhone"></div>
            </div>
            <button class="btn btn-blue" onclick="saveToSheet('Customers')">Add Customer</button>
        </div>

        <div id="admin" class="card hidden">
            <h2>Admin Controls</h2>
            <p>Welcome, <b>Owner</b>. You have full system access.</p>
            <div style="margin-top:1rem; padding:1rem; background:#fef3c7; border-radius:8px">
                <p style="font-size:0.85rem; color:#92400e">Your database connection is: <b>Active</b></p>
            </div>
        </div>
    </div>
</div>

<script>
// CONFIGURATION
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyhZJW78LNJzWZU1R_dKa_f118hnUOdltoaFwPLFdtx9-uwGL0X-HL51uq3gVu5rt4/exec';

// MATCHES YOUR GOOGLE SHEET
const AUTH = [
    {u: "Owner", p: "Craftyowner123", r: "Owner"}
];

function login() {
    const uInput = document.getElementById('username').value.trim();
    const pInput = document.getElementById('password').value.trim();
    const errDisp = document.getElementById('loginError');

    const found = AUTH.find(x => x.u === uInput && x.p === pInput);
    
    if (found) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        
        // Show Admin tab only for Owner/Admin roles
        const adminBtn = document.getElementById('adminTabBtn');
        if(found.r === 'Owner' || found.r === 'Admin') {
            adminBtn.style.display = 'block';
        } else {
            adminBtn.style.display = 'none';
        }
    } else {
        errDisp.innerText = "Invalid credentials. Try Owner / Craftyowner123";
    }
}

function showTab(id, e) {
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if(e && e.target) e.target.classList.add('active');
}

async function saveToSheet(sheetName) {
    let data = [];
    if(sheetName === 'Inventory') {
        data = [document.getElementById('invSKU').value, document.getElementById('invItem').value, document.getElementById('invPrice').value];
    } else {
        data = [document.getElementById('custName').value, document.getElementById('custEmail').value, document.getElementById('custPhone').value];
    }

    try {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ sheet: sheetName, data: data })
        });
        alert('Saved successfully to ' + sheetName);
    } catch (e) {
        alert('Error saving data.');
    }
}

document.addEventListener('keypress', (e) => { if(e.key === 'Enter') login(); });
</script>
</body>
</html>
