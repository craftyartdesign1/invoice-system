<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFTY ART DESIGN | POS SYSTEM</title>
    <style>
        :root { --blue: #2563eb; --dark: #1e293b; --light: #f8fafc; --red: #ef4444; --green: #22c55e; --border: #e2e8f0; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--light); margin: 0; padding-bottom: 50px; color: var(--dark); }

        /* Navigation */
        .top-nav { background: white; padding: 12px 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .nav-tabs { display: flex; background: white; border-bottom: 1px solid var(--border); padding: 0 40px; gap: 20px; }
        .tab { padding: 16px 10px; cursor: pointer; color: #64748b; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

        /* Main Container */
        .container { max-width: 1200px; margin: 30px auto; background: white; padding: 35px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; font-size: 20px; font-weight: 700; margin-bottom: 25px; }

        /* Grid Form Layout */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 35px; background: #f1f5f9; padding: 20px; border-radius: 8px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 6px; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        input:disabled { background: #e2e8f0; color: #64748b; }

        /* Professional Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px; background: #f8fafc; border-bottom: 2px solid var(--border); font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; }
        td { padding: 14px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .exempt-badge { background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }

        /* Footer & Totals */
        .footer-flex { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 40px; }
        .price-box { font-size: 16px; line-height: 2; text-align: right; }
        .grand-total { font-size: 28px; font-weight: 800; color: var(--blue); margin-top: 10px; }

        /* Buttons */
        .btn { padding: 10px 20px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; font-size: 14px; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-green { background: var(--green); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        @media print { .top-nav, .nav-tabs, .btn, th:last-child, td:last-child { display: none !important; } }
    </style>
</head>
<body>

<div class="top-nav">
    <h1 style="font-size: 20px; font-weight: 800; color: var(--blue); margin: 0;">CRAFTY ART DESIGN</h1>
    <div><strong>User: Alessio</strong> <button class="btn btn-red btn-sm" style="margin-left:10px;">Logout</button></div>
</div>

<div class="nav-tabs">
    <div class="tab active" onclick="loadTab('Generator', event)">Invoice Generator</div>
    <div class="tab" onclick="loadTab('Lookup', event)">Invoice Lookup</div>
</div>

<div id="mainView" class="container"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTLLbIZXmcXmepEyYpWE8XCbqD981bJZ1M2OTPNj4GS6FaObV1vJsLfZG1FmSlnlpG/exec";
    let inventory = [], customers = [], invoices = [];

    window.onload = async () => { 
        await refreshData(); 
        renderGenerator(); 
    };

    async function refreshData() {
        try {
            const [inv, cust, hist] = await Promise.all([
                fetch(`${SCRIPT_URL}?action=getInventory`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=getCustomers`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=getInvoices`).then(r => r.json())
            ]);
            inventory = inv; customers = cust; invoices = hist;
        } catch(e) { console.error("Sync Error"); }
    }

    function loadTab(tab, e) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        if (tab === 'Generator') renderGenerator();
        if (tab === 'Lookup') renderLookup();
    }

    function formatDate(dateString) {
        if (!dateString) return "---";
        const date = new Date(dateString);
        return (date.getMonth() + 1).toString().padStart(2, '0') + '/' + 
               date.getDate().toString().padStart(2, '0') + '/' + 
               date.getFullYear();
    }

    function renderGenerator(prefill = null) {
        const invNum = prefill ? prefill["Invoice Number"] : "INV-" + Math.floor(Math.random() * 900000 + 100000);
        const view = document.getElementById('mainView');
        view.innerHTML = `
            <h2>New Invoice</h2>
            <div class="form-grid">
                <div class="form-group"><label>Inv #</label><input type="text" id="invNum" value="${invNum}" disabled></div>
                <div class="form-group"><label>Date</label><input type="text" id="invDate" value="${formatDate(new Date())}" disabled></div>
                <div class="form-group"><label>Customer</label>
                    <select id="custName">
                        <option value="">Select Customer</option>
                        ${customers.map(c => `<option ${prefill && prefill.Customer === c.Name ? 'selected':''}>${c.Name}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group"><label>Employee</label><input type="text" value="Alessio" disabled></div>
            </div>

            <div style="margin-bottom: 20px; display:flex; gap:10px;">
                <input type="text" id="skuInput" placeholder="Scan SKU..." style="flex:1" onkeypress="if(event.key==='Enter') addItem()">
                <button class="btn btn-blue" onclick="addItem()">Add Item</button>
            </div>

            <table>
                <thead><tr><th>SKU</th><th>Item</th><th>Qty</th><th>Price</th><th>Tax</th><th>Total</th><th>Action</th></tr></thead>
                <tbody id="invoiceBody"></tbody>
            </table>

            <div class="footer-flex">
                <button class="btn btn-green" onclick="saveInvoice()">Save Invoice</button>
                <div class="price-box">
                    Subtotal: <span id="subTotal">$0.00</span><br>
                    Tax (8.875%): <span id="taxTotal">$0.00</span>
                    <div class="grand-total">Total: <span id="grandTotal">$0.00</span></div>
                </div>
            </div>`;
    }

    function addItem() {
        const sku = document.getElementById('skuInput').value;
        const item = inventory.find(i => String(i.SKU).toLowerCase() === sku.toLowerCase());
        if(!item) return alert("SKU Not Found");
        
        const isExempt = item["Tax Exempt"] === true || item["Tax Exempt"] === "TRUE";
        const tr = document.createElement('tr');
        tr.setAttribute('data-exempt', isExempt);
        tr.innerHTML = `
            <td>${item.SKU}</td>
            <td>${item["Item Name"]}</td>
            <td><input type="number" value="1" min="1" style="width:50px" oninput="calc()"></td>
            <td>$${parseFloat(item.Price).toFixed(2)}</td>
            <td>${isExempt ? '<span class="exempt-badge">EXEMPT</span>' : '8.875%'}</td>
            <td class="row-total">$0.00</td>
            <td><button class="btn btn-red btn-sm" onclick="this.closest('tr').remove(); calc()">X</button></td>`;
        document.getElementById('invoiceBody').appendChild(tr);
        document.getElementById('skuInput').value = "";
        calc();
    }

    function calc() {
        let sub = 0, taxable = 0;
        document.querySelectorAll('#invoiceBody tr').forEach(tr => {
            const q = tr.cells[2].querySelector('input').value;
            const p = tr.cells[3].innerText.replace('$','');
            const total = q * p;
            tr.cells[5].innerText = "$" + total.toFixed(2);
            sub += total;
            if(tr.getAttribute('data-exempt') !== 'true') taxable += total;
        });
        const tax = taxable * 0.08875;
        document.getElementById('subTotal').innerText = "$" + sub.toFixed(2);
        document.getElementById('taxTotal').innerText = "$" + tax.toFixed(2);
        document.getElementById('grandTotal').innerText = "$" + (sub + tax).toFixed(2);
    }

    async function saveInvoice() {
        const data = {
            action: 'save',
            invoiceNumber: document.getElementById('invNum').value,
            date: document.getElementById('invDate').value,
            customer: document.getElementById('custName').value,
            total: document.getElementById('grandTotal').innerText.replace('$',''),
            employee: 'Alessio'
        };
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
        alert("Invoice Saved!");
        refreshData();
    }

    function renderLookup() {
        document.getElementById('mainView').innerHTML = `
            <h2>Invoice History</h2>
            <table>
                <thead><tr><th>Inv #</th><th>Date</th><th>Customer</th><th>Total</th><th>Action</th></tr></thead>
                <tbody>
                    ${invoices.map(inv => `
                        <tr>
                            <td>${inv["Invoice Number"]}</td>
                            <td>${formatDate(inv.Date)}</td>
                            <td>${inv.Customer}</td>
                            <td><strong>$${parseFloat(inv.Total || 0).toFixed(2)}</strong></td>
                            <td><button class="btn btn-blue btn-sm" onclick="window.print()">Print</button></td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>`;
    }
</script>
</body>
</html>
