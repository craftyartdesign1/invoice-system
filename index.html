<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOdk22rBVmow1ZkVp9QVHic_Moo4prKkBLe4gF7-52JAXGncOs0XD96huFUyfQyRIp/exec";
    const OWNER_ID = "craftyartdesign1"; 
    
    // In a real scenario, this would be set by your login. 
    // For now, it's set to you (the Owner).
    let currentUser = { 
        username: "craftyartdesign1", 
        role: "Admin",
        canEditInv: true,
        canEditCust: true
    }; 

    document.getElementById('currentUserDisplay').innerText = `User: ${currentUser.username}`;

    let activeTab = "Users";
    let editMode = false;
    let currentId = "";

    async function switchTab(tabName) {
        activeTab = tabName;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.innerText === tabName));
        const view = document.getElementById('mainView');
        view.innerHTML = "Loading...";
        try {
            const res = await fetch(`${SCRIPT_URL}?action=get${tabName}`);
            const data = await res.json();
            renderTable(tabName, data);
        } catch (e) { view.innerHTML = "<p style='color:red'>Error loading data.</p>"; }
    }

    function showAddressPopup(name, addr) {
        alert(`Full Address for ${name}:\n\n${addr}`);
    }

    function renderTable(type, data) {
        const isOwner = currentUser.username === OWNER_ID;
        let html = `<div class="card">`;
        
        // Show "Add" button only if user has permission
        if ((type === 'Inventory' && currentUser.canEditInv) || 
            (type === 'Customers' && currentUser.canEditCust) || isOwner) {
            html += `<button class="btn btn-blue btn-add" onclick="openModal(false)">+ ADD ${type.toUpperCase()}</button>`;
        }

        html += `<h3>${type} Management</h3><table><thead><tr>`;
        
        if (type === 'Users') {
            html += `<th>Username</th><th>Role</th><th>Display Name</th><th>Inv Access</th><th>Cust Access</th><th>Actions</th></tr></thead><tbody>`;
            data.forEach(item => { if (item.Username) {
                const json = JSON.stringify(item).replace(/"/g, '&quot;');
                html += `<tr><td><b>${item.Username}</b></td><td>${item.Role}</td><td>${item["Display Name"]}</td><td style="text-align:center">${item["Can Edit Inventory"]?'✅':'❌'}</td><td style="text-align:center">${item["Can Edit Customers"]?'✅':'❌'}</td><td>${isOwner?`<button class="btn btn-blue" onclick="openModal(true, '${json}')">EDIT</button><button class="btn btn-red" onclick="deleteRow('${item.Username}')">DEL</button>`:''}</td></tr>`;
            }});
        } else if (type === 'Inventory') {
            html += `<th>SKU</th><th>Item Name</th><th>Price</th><th>Size</th><th>Tax</th><th>Actions</th></tr></thead><tbody>`;
            data.forEach(item => { if (item.SKU) {
                const json = JSON.stringify(item).replace(/"/g, '&quot;');
                html += `<tr>
                    <td><b>${item.SKU}</b></td>
                    <td>${item["Item Name"]}</td>
                    <td>$${item.Price}</td>
                    <td>${item.Size || ''}</td>
                    <td style="text-align:center">${item["Tax Exempt"]?'Exempt':'Taxed'}</td>
                    <td>
                        ${currentUser.canEditInv || isOwner ? `<button class="btn btn-blue" onclick="openModal(true, '${json}')">EDIT</button>` : ''}
                        ${isOwner ? `<button class="btn btn-red" onclick="deleteRow('${item.SKU}')">DEL</button>` : ''}
                    </td></tr>`;
            }});
        } else if (type === 'Customers') {
            html += `<th>Name</th><th>Company</th><th>Street Address</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead><tbody>`;
            data.forEach(item => { if (item.Name) {
                const json = JSON.stringify(item).replace(/"/g, '&quot;');
                const street = item["Street Address"] || '';
                const fullAddr = `${street}, ${item.City || ''}, ${item.State || ''} ${item["Zip Code"] || ''}`;

                html += `<tr>
                    <td><b>${item.Name}</b></td>
                    <td>${item.Company || ''}</td>
                    <td>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span>${street || 'No Street'}</span>
                            <span class="info-pill" onclick="showAddressPopup('${item.Name}', '${fullAddr}')">Info</span>
                        </div>
                    </td>
                    <td>${item.Email || ''}</td>
                    <td>${item.Phone || ''}</td>
                    <td>
                        ${currentUser.canEditCust || isOwner ? `<button class="btn btn-blue" onclick="openModal(true, '${json}')">EDIT</button>` : ''}
                        ${isOwner ? `<button class="btn btn-red" onclick="deleteRow('${item.Name}')">DEL</button>` : ''}
                    </td>
                </tr>`;
            }});
        }
        document.getElementById('mainView').innerHTML = html + "</tbody></table></div>";
    }

    function openModal(isEdit, dataStr = null) {
        editMode = isEdit;
        const fields = document.getElementById('modalFields');
        const isOwner = currentUser.username === OWNER_ID;
        fields.innerHTML = "";
        
        const m = document.getElementById('draggableModal');
        m.style.left = '50%'; m.style.top = '50%'; m.style.transform = 'translate(-50%, -50%)';
        xOffset = 0; yOffset = 0;

        if (activeTab === 'Customers') {
            document.getElementById('modalTitle').innerText = isEdit ? "Edit Customer" : "Add Customer";
            fields.innerHTML = `
                <input id="f1" placeholder="Customer Name" ${(isEdit && !isOwner) ? 'disabled' : ''}>
                <input id="f2" placeholder="Company Name">
                <input id="f3" placeholder="Street Address">
                <div class="address-grid"><input id="f4" placeholder="City"><input id="f5" placeholder="State"></div>
                <div class="address-grid"><input id="f6" placeholder="Zip Code"><input id="f7" placeholder="Email Address"></div>
                <input id="f8" placeholder="Phone Number">
                <div class="check-group"><input type="checkbox" id="f9"> <label>Tax Exempt Customer</label></div>`;
        } else if (activeTab === 'Inventory') {
            document.getElementById('modalTitle').innerText = isEdit ? "Edit Item" : "Add Item";
            fields.innerHTML = `
                <input id="f1" placeholder="SKU" ${(isEdit && !isOwner) ? 'disabled' : ''}>
                <input id="f2" placeholder="Item Name">
                <input id="f3" type="number" placeholder="Price">
                <input id="f4" placeholder="Size (e.g. XL or 24x36)">
                <div class="check-group"><input type="checkbox" id="f5"> <label>Tax Exempt</label></div>`;
        } else {
            document.getElementById('modalTitle').innerText = isEdit ? "Edit User" : "Add User";
            fields.innerHTML = `<input id="f1" placeholder="Username" ${isEdit ? 'disabled' : ''}><input id="f2" type="password" placeholder="Pass"><select id="f3"><option value="Staff">Staff</option><option value="Admin">Admin</option></select><input id="f4" placeholder="Name"><div class="check-group"><input type="checkbox" id="f5"> <label>Inv Access</label></div><div class="check-group"><input type="checkbox" id="f6"> <label>Cust Access</label></div>`;
        }

        if (isEdit && dataStr) {
            const data = JSON.parse(dataStr.replace(/&quot;/g, '"'));
            currentId = data.Username || data.SKU || data.Name;
            document.getElementById('f1').value = currentId;
            if (activeTab === 'Customers') {
                document.getElementById('f2').value = data.Company || '';
                document.getElementById('f3').value = data["Street Address"] || '';
                document.getElementById('f4').value = data.City || '';
                document.getElementById('f5').value = data.State || '';
                document.getElementById('f6').value = data["Zip Code"] || '';
                document.getElementById('f7').value = data.Email || '';
                document.getElementById('f8').value = data.Phone || '';
                document.getElementById('f9').checked = (data["Tax Exempt"] === true || data["Tax Exempt"] === "TRUE");
            } else if (activeTab === 'Inventory') {
                document.getElementById('f2').value = data["Item Name"] || '';
                document.getElementById('f3').value = data.Price || '';
                document.getElementById('f4').value = data.Size || '';
                document.getElementById('f5').checked = (data["Tax Exempt"] === true || data["Tax Exempt"] === "TRUE");
            } else {
                document.getElementById('f2').value = data.Password || '';
                document.getElementById('f3').value = data.Role || 'Staff';
                document.getElementById('f4').value = data["Display Name"] || '';
                document.getElementById('f5').checked = (data["Can Edit Inventory"] === true || data["Can Edit Inventory"] === "TRUE");
                document.getElementById('f6').checked = (data["Can Edit Customers"] === true || data["Can Edit Customers"] === "TRUE");
            }
        }
        document.getElementById('saveBtn').onclick = handleSave;
        document.getElementById('appModal').style.display = 'block';
    }

    async function handleSave() {
        let rowData = [];
        if (activeTab === 'Customers') {
            rowData = [document.getElementById('f1').value, document.getElementById('f2').value, document.getElementById('f3').value, document.getElementById('f4').value, document.getElementById('f5').value, document.getElementById('f6').value, document.getElementById('f7').value, document.getElementById('f8').value, document.getElementById('f9').checked];
        } else if (activeTab === 'Inventory') {
            rowData = [document.getElementById('f1').value, document.getElementById('f2').value, document.getElementById('f3').value, document.getElementById('f4').value, document.getElementById('f5').checked];
        } else {
            rowData = [document.getElementById('f1').value, document.getElementById('f2').value, document.getElementById('f3').value, document.getElementById('f4').value, document.getElementById('f5').checked, document.getElementById('f6').checked];
        }
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: editMode ? 'editRow' : 'addRow', sheetName: activeTab, id: currentId, data: rowData })});
        closeModal(); switchTab(activeTab);
    }

    function closeModal() { document.getElementById('appModal').style.display = 'none'; }
    async function deleteRow(id) {
        if(confirm(`Delete ${id}?`)) {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: 'deleteRow', sheetName: activeTab, id: id}) });
            switchTab(activeTab);
        }
    }

    // Draggable Window Logic
    const dragItem = document.getElementById("draggableModal");
    const dragHeader = document.getElementById("modalHeader");
    let active = false; let currentX; let currentY; let initialX; let initialY; let xOffset = 0; let yOffset = 0;

    dragHeader.onmousedown = (e) => {
        initialX = e.clientX - xOffset; initialY = e.clientY - yOffset;
        active = true;
    };
    document.onmouseup = () => { active = false; };
    document.onmousemove = (e) => {
        if (active) {
            e.preventDefault();
            currentX = e.clientX - initialX; currentY = e.clientY - initialY;
            xOffset = currentX; yOffset = currentY;
            dragItem.style.transform = `translate(calc(-50% + ${currentX}px), calc(-50% + ${currentY}px))`;
        }
    };

    switchTab('Users');
</script>
