<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD | NYC POS SYSTEM - MASTER v4</title>
    <style>
        :root { --blue: #004080; --dark: #333; --light: #f4f7f6; --red: #e74c3c; --green: #28a745; --gold: #ffd700; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-color, var(--light)); background-size: cover; margin: 0; min-height: 100vh; }
        
        .header-section { background: white; padding: 15px 30px; border-bottom: 4px solid var(--blue); display: flex; justify-content: space-between; align-items: center; }
        #logo-container img { max-height: 60px; }
        .nav-bar { display: flex; background: var(--dark); padding: 10px; gap: 10px; overflow-x: auto; }
        .tab { padding: 12px 20px; color: white; border: none; background: #555; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .tab.active { background: var(--blue); border-bottom: 3px solid var(--gold); }

        .content { padding: 20px; max-width: 1300px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }

        .pos-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .pos-table th { background: #f8fafc; padding: 12px; text-align: left; border-bottom: 2px solid #ddd; font-size: 0.85rem; text-transform: uppercase; }
        .pos-table td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        .btn { padding: 10px 18px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-green { background: var(--green); }
        .btn-blue { background: #2563eb; }
        .btn-red { background: var(--red); }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; margin: 2px; }
        
        .pass-wrapper { position: relative; display: flex; align-items: center; max-width: 300px; }
        .eye-btn { position: absolute; right: 10px; cursor: pointer; background: none; border: none; font-size: 1.1rem; }

        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 100%; }
        input:disabled { background: #f9f9f9; color: #888; }
        
        .total-area { text-align: right; margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px; }
        .grand-total { font-size: 2.2rem; font-weight: bold; color: var(--blue); }

        @media print { 
            .nav-bar, .header-section, .btn-no-print, .action-col, #adminTab { display: none !important; } 
            .card { box-shadow: none; border: none; padding: 0; margin: 0; width: 100%; }
            body { background: white !important; }
        }
    </style>
</head>
<body>

<div class="header-section">
    <div id="logo-container"><h2 style="margin:0; color: var(--blue);">CRAFTY ART DESIGN</h2></div>
    <div style="text-align: right;">
        <strong>User: <span id="displayUser">Alessio</span></strong><br>
        <button class="btn btn-blue btn-sm btn-no-print" onclick="toggleRole()" style="margin-top:5px; background:#666;">🛠️ Switch Role</button>
    </div>
</div>

<nav class="nav-bar">
    <button class="tab active" onclick="loadTab('Generator')">Invoice Generator</button>
    <button class="tab" onclick="loadTab('Lookup')">Invoice Lookup</button>
    <button class="tab" onclick="loadTab('Inventory')">Inventory</button>
    <button class="tab" onclick="loadTab('Customers')">Customers</button>
    <button id="adminTab" class="tab" onclick="loadTab('Settings')">⚙️ Admin Settings</button>
</nav>

<div class="content" id="mainView"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxNDPBFyPktfE46fGJg8PhZSH9q7_LBDDJDZ-SLyjo5Pd27PQxKyVCoARhZCoyr0MCc/exec";
    const TAX_RATE = 0.08875;
    let inventory = [], customers = [], invoices = [];
    let managerPin = "1234";
    let currentUser = { name: 'Alessio', role: 'Admin' };
    let users = [{name: "Alessio", role: "Admin", pass: "admin123"}, {name: "Staff", role: "Staff", pass: "staff456"}];

    window.onload = async () => { await refreshData(); loadTab('Generator'); };

    async function refreshData() {
        try {
            const [i, c, inv] = await Promise.all([
                fetch(`${SCRIPT_URL}?action=getInventory`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=getCustomers`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=getInvoices`).then(r => r.json())
            ]);
            inventory = i.filter(row => row.SKU && row.SKU.toString().trim() !== "");
            customers = c.filter(row => row.Name && row.Name.toString().trim() !== "");
            invoices = inv.filter(row => row["Invoice Number"]);
        } catch(e) { console.log("Database Sync Error."); }
    }

    function toggleRole() {
        currentUser = (currentUser.role === 'Admin') ? users[1] : users[0];
        document.getElementById('displayUser').innerText = currentUser.name;
        document.getElementById('adminTab').style.display = (currentUser.role === 'Admin') ? 'block' : 'none';
        loadTab('Generator');
    }

    function togglePass(id) {
        const x = document.getElementById(id);
        x.type = (x.type === "password") ? "text" : "password";
    }

    function loadTab(name, prefillData = null) {
        const view = document.getElementById('mainView');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(t => { if(t.innerText.includes(name)) t.classList.add('active'); });

        if (name === 'Generator') renderGenerator(view, prefillData);
        else if (name === 'Lookup') renderLookup(view);
        else if (name === 'Inventory' || name === 'Customers') renderDataList(name, view);
        else if (name === 'Settings') renderSettings(view);
    }

    function renderGenerator(view, data = null) {
        const invNum = data ? data["Invoice Number"] : "INV-" + Math.floor(100000 + Math.random() * 900000);
        view.innerHTML = `
            <div class="card" id="invoiceArea">
                <div style="display:flex; justify-content:space-between; border-bottom: 2px solid #eee; padding-bottom:10px;">
                    <div><h2 style="margin:0; color:var(--blue);">INVOICE</h2><strong>No: ${invNum}</strong></div>
                    <div style="text-align:right;">Date: ${data ? data.Date : new Date().toLocaleDateString()}</div>
                </div>
                <div style="margin: 20px 0;">
                    <label>Customer Name:</label>
                    <select id="posCustomer">
                        <option value="">Select Customer...</option>
                        ${customers.map(c=>`<option ${data && data.Customer === c.Name ? 'selected' : ''}>${c.Name}</option>`).join('')}
                    </select>
                </div>
                <table class="pos-table">
                    <thead><tr><th>SKU</th><th>Item Description</th><th>Qty</th><th>Price</th><th>Total</th><th class="btn-no-print"></th></tr></thead>
                    <tbody id="posBody"></tbody>
                </table>
                <button class="btn btn-blue btn-sm btn-no-print" onclick="addRow()" style="margin-top:10px;">+ Add Line Item</button>
                <div class="total-area">
                    Subtotal: <span id="subTotal">$0.00</span><br>
                    NYC Sales Tax (8.875%): <span id="taxTotal">$0.00</span>
                    <div class="grand-total">Total: <span id="grandDisp">$0.00</span></div>
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;" class="btn-no-print">
                    <button class="btn btn-green" style="flex:1;" onclick="window.print()">PRINT INVOICE</button>
                    <button class="btn btn-blue" style="flex:1;" onclick="alert('Invoice Record Saved')">SAVE RECORD</button>
                </div>
            </div>`;
        if (data && data.Items) data.Items.forEach(item => addRow(item)); else addRow();
        calcTotal();
    }

    function addRow(itemData = null) {
        const isAdmin = currentUser.role === 'Admin';
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" onchange="autoFill(this)" value="${itemData ? itemData.SKU : ''}" placeholder="SKU"></td>
            <td><input type="text" value="${itemData ? (itemData.Name || itemData.Item) : ''}" ${!isAdmin?'disabled':''}></td>
            <td><input type="number" value="${itemData ? itemData.Qty : 1}" min="1" oninput="calcTotal()"></td>
            <td>
                <input type="text" value="${itemData ? itemData.Price : ''}" ${!isAdmin?'disabled':''}>
                <div style="font-size:10px; margin-top:5px;" class="btn-no-print">
                    <input type="checkbox" style="width:auto;" onchange="calcTotal()" ${itemData && itemData.exempt ? 'checked' : ''}> Tax Exempt
                </div>
            </td>
            <td class="row-total">$0.00</td>
            <td class="btn-no-print"><button class="btn btn-red btn-sm" onclick="this.parentElement.parentElement.remove(); calcTotal();">X</button></td>`;
        document.getElementById('posBody').appendChild(tr);
        calcTotal();
    }

    function calcTotal() {
        let taxableSubtotal = 0, exemptSubtotal = 0;
        document.querySelectorAll('#posBody tr').forEach(tr => {
            const q = parseFloat(tr.cells[2].children[0].value) || 0;
            const p = parseFloat(tr.cells[3].children[0].value) || 0;
            const isExempt = tr.cells[3].querySelector('input[type="checkbox"]').checked;
            const rowSum = q * p;
            tr.cells[4].innerHTML = "$" + rowSum.toFixed(2) + (isExempt ? '<br><small style="color:green;font-weight:bold;">TAX EXEMPT</small>' : '');
            if (isExempt) exemptSubtotal += rowSum; else taxableSubtotal += rowSum;
        });
        const tax = taxableSubtotal * TAX_RATE;
        document.getElementById('subTotal').innerText = "$" + (taxableSubtotal + exemptSubtotal).toFixed(2);
        document.getElementById('taxTotal').innerText = "$" + tax.toFixed(2);
        document.getElementById('grandDisp').innerText = "$" + (taxableSubtotal + exemptSubtotal + tax).toFixed(2);
    }

    function renderLookup(view) {
        const isAdmin = currentUser.role === 'Admin';
        view.innerHTML = `
            <div class="card">
                <h3>Invoice History</h3>
                <table class="pos-table">
                    <thead><tr><th>Invoice #</th><th>Date</th><th>Customer</th><th>Total Price</th><th>Employee</th><th class="action-col">Actions</th></tr></thead>
                    <tbody>${invoices.map(inv => `
                        <tr>
                            <td>${inv["Invoice Number"]}</td>
                            <td>${inv.Date}</td>
                            <td>${inv.Customer}</td>
                            <td><strong>$${parseFloat(inv.Total || 0).toFixed(2)}</strong></td>
                            <td>${inv.Employee || 'Alessio'}</td>
                            <td class="action-col">
                                <button class="btn btn-blue btn-sm" onclick='reprintInvoice(${JSON.stringify(inv).replace(/'/g, "&apos;")})'>Print</button>
                                ${isAdmin ? `
                                    <button class="btn btn-blue btn-sm" onclick='loadTab("Generator", ${JSON.stringify(inv).replace(/'/g, "&apos;")})'>Edit</button>
                                    <button class="btn btn-red btn-sm" onclick="deleteInvoice('${inv["Invoice Number"]}')">Delete</button>
                                ` : ''}
                            </td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
    }

    function reprintInvoice(invData) {
        loadTab('Generator', invData);
        setTimeout(() => { window.print(); }, 600);
    }

    function deleteInvoice(invNum) {
        const pin = prompt("Admin Security: Enter Manager PIN to delete " + invNum);
        if(pin === managerPin) {
            if(confirm("Permanently delete this invoice?")) {
                invoices = invoices.filter(i => i["Invoice Number"] !== invNum);
                renderLookup(document.getElementById('mainView'));
            }
        } else { alert("Incorrect PIN."); }
    }

    function autoFill(input) {
        const item = inventory.find(i => String(i.SKU).toLowerCase() === input.value.toLowerCase());
        if(item) {
            const tr = input.closest('tr');
            tr.cells[1].children[0].value = item["Item Name"];
            tr.cells[3].children[0].value = item.Price;
            calcTotal();
        }
    }

    function renderDataList(name, view) {
        const isAdmin = currentUser.role === 'Admin';
        let data = (name === 'Inventory' ? inventory : customers);
        view.innerHTML = `
            <div class="card">
                <h3>${name} Database</h3>
                <table class="pos-table">
                    <thead><tr>
                        <th>${name === 'Inventory' ? 'SKU' : 'Name'}</th>
                        <th>${name === 'Inventory' ? 'Item Name' : 'Street Address'}</th>
                        <th>${name === 'Inventory' ? 'Price' : 'City/Info'}</th>
                        <th class="action-col">Actions</th>
                    </tr></thead>
                    <tbody>${data.map(r => `
                        <tr>
                            <td>${name === 'Inventory' ? r.SKU : r.Name}</td>
                            <td>${name === 'Inventory' ? r["Item Name"] : (r["Street Address"] || '---')}</td>
                            <td>${name === 'Inventory' ? '$'+parseFloat(r.Price || 0).toFixed(2) : (r.City || '---')}</td>
                            <td class="action-col">
                                ${isAdmin ? `<button class="btn btn-blue btn-sm">Edit</button> <button class="btn btn-red btn-sm">Delete</button>` : '<span style="color:#aaa">Locked</span>'}
                            </td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
    }

    function renderSettings(view) {
        view.innerHTML = `
            <div class="card">
                <h3>Admin Branding</h3>
                <label>Update Logo:</label> <input type="file" onchange="updateLogo(this)" style="margin-bottom:15px;">
                <label>Update Background:</label> <input type="file" onchange="updateBg(this)">
                <hr style="margin:25px 0;">
                <h3>Security & Access</h3>
                <label>Manager Override PIN:</label>
                <div class="pass-wrapper"><input type="password" id="mPin" value="${managerPin}"><button class="eye-btn" onclick="togglePass('mPin')">👁️</button></div>
                <hr style="margin:25px 0;">
                <h3>User Credentials</h3>
                <table class="pos-table">
                    ${users.map((u,i)=>`<tr><td>${u.name}</td><td>${u.role}</td><td><div class="pass-wrapper"><input type="password" id="uPass${i}" value="${u.pass}"><button class="eye-btn" onclick="togglePass('uPass${i}')">👁️</button></div></td></tr>`).join('')}
                </table>
            </div>`;
    }

    function updateLogo(input) {
        const r = new FileReader(); r.onload = (e) => document.getElementById('logo-container').innerHTML = `<img src="${e.target.result}">`;
        r.readAsDataURL(input.files[0]);
    }
    function updateBg(input) {
        const r = new FileReader(); r.onload = (e) => document.body.style.backgroundImage = `url('${e.target.result}')`;
        r.readAsDataURL(input.files[0]);
    }
</script>
</body>
</html>
