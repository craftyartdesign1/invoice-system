<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafty Art Design | Management System</title>
    <style>
        :root { --primary: #000000; --danger: #ef4444; --bg: #f3f4f6; --text: #1f2937; --white: #ffffff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--white); width: 90%; max-width: 400px; padding: 2.5rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .login-logo { width: 180px; margin-bottom: 1.5rem; }
        .login-box input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 1rem; }
        .header { background: var(--white); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; position: sticky; top:0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 50px; width: auto; }
        .tabs { background: var(--white); display: flex; padding: 0 2rem; border-bottom: 1px solid #e5e7eb; gap: 1.5rem; }
        .tab { padding: 1rem 0; border: none; background: none; cursor: pointer; font-weight: 600; color: #6b7280; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .content { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--white); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .btn { padding: 0.7rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; background: var(--primary); color: var(--white); transition: 0.2s; }
        .btn-success { background: #10b981; }
        .hidden { display: none !important; }
        @media print { .no-print, .tabs, .header { display: none !important; } #invoice { box-shadow: none; border: none; } }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <img src="https://i.ibb.co/3Wq87D6/my-logo-no-backgroung.png" class="login-logo" alt="Crafty Art Design">
            <h2>Staff Login</h2>
            <p style="margin-bottom: 1.5rem; color: #6b7280; font-size: 0.9rem;">Management Portal</p>
            <input type="text" id="user" placeholder="Username">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn" style="width:100%" onclick="handleLogin()">Sign In</button>
            <p id="loginErr" style="color:var(--danger); font-size:0.85rem; margin-top:10px;"></p>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <div class="header">
            <div class="brand">
                <img src="https://i.ibb.co/3Wq87D6/my-logo-no-backgroung.png" class="logo-img">
                <h2 style="font-size: 1.1rem;">CRAFTY ART DESIGN</h2>
            </div>
            <div id="syncStatus" style="font-size: 0.75rem; color: #10b981; font-weight: bold;">CONNECTED ☁️</div>
        </div>

        <div class="tabs no-print">
            <button class="tab active" onclick="switchTab('invoice', event)">Invoices</button>
            <button class="tab" onclick="switchTab('inventory', event)">Inventory</button>
            <button class="tab" onclick="switchTab('customers', event)">Customers</button>
        </div>

        <div class="content">
            <div id="invoice" class="card">
                <h1>INVOICE BUILDER</h1>
                <p>Welcome, <span id="displayUser"></span>. Start by adding a customer.</p>
                </div>
        </div>
    </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzviCex-8kansCAW5SJ7m7ZpoPu4fdvukPOgtCeHTMuvndMWT0iRNH4JgJN993RU1LU/exec';
    
    async function handleLogin() {
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value.trim();
        const err = document.getElementById('loginErr');
        err.innerText = "Verifying...";
        
        try {
            const response = await fetch(`${SCRIPT_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`);
            const result = await response.json();
            
            if(result.success) {
                document.getElementById('displayUser').innerText = u;
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                // Load data here
            } else {
                err.innerText = "Invalid credentials. Check your Google Sheet.";
            }
        } catch (e) {
            err.innerText = "Network Error. Check Web App Deployment.";
        }
    }

    function switchTab(id, e) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
    }
</script>
</body>
</html>
