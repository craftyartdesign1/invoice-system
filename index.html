<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafty Art Design | Management POS</title>
    <style>
        :root { --primary: #000000; --bg: #f3f4f6; --white: #ffffff; --text: #1f2937; --danger: #ef4444; --success: #22c55e; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); }
        #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        #mainApp { display: none; }
        .login-box { background: var(--white); width: 90%; max-width: 400px; padding: 2.5rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        header { background: var(--white); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; }
        .nav-tabs { display: flex; background: #e5e7eb; padding: 10px 20px; gap: 10px; }
        .tab-btn { padding: 8px 18px; cursor: pointer; border: none; background: #f3f4f6; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }
        .content-area { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #f8fafc; text-align: left; padding: 12px; border-bottom: 2px solid #e2e8f0; font-size: 0.75rem; text-transform: uppercase; color: #64748b; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 0.8rem; color: #4b5563; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0,0,0,0.05); }
        input:read-only { background-color: #f9fafb; color: #9ca3af; cursor: not-allowed; }
        .btn-primary { width: 100%; padding: 0.85rem; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .btn-secondary { background: #9ca3af; margin-top: 10px; }
        #invoiceModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 2rem; border-radius: 15px; width: 95%; max-width: 580px; max-height: 95vh; overflow-y: auto; position: relative; }
        .custom-size-box { display: none; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .exempt-label { color: var(--danger); font-size: 0.75rem; font-weight: 800; display: none; margin-top: 4px; }
        .badge-paid { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h1 style="margin-bottom:10px;">Crafty Art Design</h1>
            <p style="color:#6b7280; margin-bottom:20px;">Management System v2.0</p>
            <input type="text" id="username" placeholder="Username" style="margin-bottom:12px;">
            <input type="password" id="password" placeholder="Password" style="margin-bottom:20px;">
            <button class="btn-primary" onclick="handleLogin()">Sign In</button>
        </div>
    </div>

    <div id="mainApp">
        <header>
            <h2 style="letter-spacing:-1px;">CRAFTY ART DESIGN</h2>
            <div><span id="userDisplay" style="font-weight:bold; color:var(--primary);"></span> | <a href="#" onclick="location.reload()" style="color:var(--danger); text-decoration:none; font-size:0.8rem;">Logout</a></div>
        </header>
        <nav class="nav-tabs">
            <button class="tab-btn" id="t-dash" onclick="showDashboard()">Dashboard</button>
            <button class="tab-btn" id="t-inv" onclick="loadInventory()">Inventory</button>
            <button class="tab-btn active" id="t-sales" onclick="loadInvoices()">Invoices</button>
        </nav>
        <div class="content-area" id="pageContent"></div>
    </div>

    <div id="invoiceModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:2px solid #f3f4f6; padding-bottom:10px;">
                <h3 style="font-size:1.4rem;">New Sale</h3>
                <span id="invRefLabel" style="font-weight:bold; color:#64748b; background:#f1f5f9; padding:5px 12px; border-radius:6px;"></span>
            </div>

            <div class="form-group">
                <label>Barcode / SKU Quick Scan</label>
                <input type="text" id="barcodeInput" placeholder="Click & Scan..." oninput="handleScan(this.value)" autofocus>
            </div>

            <div class="form-group">
                <label>Item Name</label>
                <select id="itemSelect" onchange="applyItemSelection()">
                    <option value="">-- Choose from List --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Size / Dimensions</label>
                <select id="sizeSelect" onchange="checkSize()">
                    <option value="XS">XS</option><option value="S">S</option><option value="M">M</option>
                    <option value="L">L</option><option value="XL">XL</option><option value="2XL">2XL</option>
                    <option value="3XL">3XL</option><option value="4XL">4XL</option><option value="5XL">5XL</option>
                    <option value="CUSTOM">Custom (W x H Inches)</option>
                </select>
                <div id="customSizeInput" class="custom-size-box">
                    <input type="number" id="cWidth" placeholder="Width (in)">
                    <input type="number" id="cHeight" placeholder="Height (in)">
                </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                <div class="form-group"><label>Customer Name</label><select id="custSelect"></select></div>
                <div class="form-group"><label>Quantity</label><input type="number" id="qty" value="1" min="1" oninput="doMath()"></div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                <div class="form-group"><label>Unit Price ($)</label><input type="number" id="price" step="0.01" oninput="doMath()"></div>
                <div class="form-group">
                    <label>Tax Amount ($)</label>
                    <input type="number" id="tax" step="0.01" value="0.00" oninput="doMath()">
                    <span id="taxExemptMsg" class="exempt-label">⚠️ TAX EXEMPT ITEM</span>
                </div>
            </div>

            <div style="background:#000; color:#fff; padding:20px; border-radius:12px; text-align:right; margin-bottom:20px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);">
                <p style="font-size:0.75rem; text-transform:uppercase; opacity:0.7; margin-bottom:4px;">Grand Total Due</p>
                <h1 id="totalDisplay" style="font-size:2.2rem; margin:0;">$0.00</h1>
            </div>

            <button class="btn-primary" id="saveBtn" onclick="submitInvoice()">Save & Complete Sale</button>
            <button class="btn-primary btn-secondary" onclick="closeModal()">Discard</button>
        </div>
    </div>

    <script>
        // Update this URL with your current Apps Script deployment URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyajDAhYYMHwUOCKGzlhtPQS66AZ3KNcnx5Bqtkw_40lt8dy0rXI0UcJTMY_L8XlbM/exec";
        let currentUser = "";
        let globalInv = [];
        let globalCustomers = [];

        async function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!u || !p) return alert("Please enter credentials");
            
            const res = await fetch(`${SCRIPT_URL}?action=login&username=${u}&password=${p}`);
            const data = await res.json();
            if(data.success) {
                currentUser = data.user.display_name;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('userDisplay').innerText = currentUser;
                loadInvoices();
            } else { alert("Invalid login. Please try again."); }
        }

        async function openModal() {
            document.getElementById('invoiceModal').style.display = 'flex';
            document.getElementById('barcodeInput').focus();
            
            const [cRes, iRes, nRes] = await Promise.all([
                fetch(`${SCRIPT_URL}?action=getCustomers`),
                fetch(`${SCRIPT_URL}?action=getInventory`),
                fetch(`${SCRIPT_URL}?action=getNextInvoiceNumber`)
            ]);
            
            globalCustomers = await cRes.json();
            globalInv = await iRes.json();
            const nData = await nRes.json();

            window.currentInvNum = nData.nextInvoice;
            document.getElementById('invRefLabel').innerText = nData.nextInvoice;

            const cSel = document.getElementById('custSelect');
            cSel.innerHTML = '<option value="">-- Select Customer --</option>';
            globalCustomers.forEach(c => cSel.innerHTML += `<option value="${c.name}">${c.name}</option>`);

            const iSel = document.getElementById('itemSelect');
            iSel.innerHTML = '<option value="">-- Select Item --</option>';
            globalInv.forEach(i => iSel.innerHTML += `<option value="${i.sku_barcode}">${i.item_name}</option>`);
        }

        function handleScan(val) {
            const item = globalInv.find(i => i.sku_barcode.toString() === val);
            if(item) {
                document.getElementById('itemSelect').value = item.sku_barcode;
                applyItemSelection();
                document.getElementById('barcodeInput').value = "";
            }
        }

        function applyItemSelection() {
            const sku = document.getElementById('itemSelect').value;
            const item = globalInv.find(i => i.sku_barcode.toString() === sku);
            if(item) {
                document.getElementById('price').value = item.price.toString().replace('$','');
                const isExempt = (item.tax_exempt === true || item.tax_exempt === "TRUE");
                const tInput = document.getElementById('tax');
                tInput.value = "0.00";
                tInput.readOnly = isExempt;
                document.getElementById('taxExemptMsg').style.display = isExempt ? 'block' : 'none';
                doMath();
            }
        }

        function checkSize() {
            const isCustom = document.getElementById('sizeSelect').value === "CUSTOM";
            document.getElementById('customSizeInput').style.display = isCustom ? 'grid' : 'none';
        }

        function doMath() {
            const p = parseFloat(document.getElementById('price').value) || 0;
            const q = parseFloat(document.getElementById('qty').value) || 1;
            const t = parseFloat(document.getElementById('tax').value) || 0;
            document.getElementById('totalDisplay').innerText = "$" + ((p * q) + t).toFixed(2);
        }

        async function submitInvoice() {
            const size = document.getElementById('sizeSelect').value;
            const finalSize = size === "CUSTOM" ? `${document.getElementById('cWidth').value}x${document.getElementById('cHeight').value} in` : size;
            const itemText = document.getElementById('itemSelect').selectedOptions[0].text;
            
            if(!itemText || !document.getElementById('custSelect').value) {
                return alert("Please select an item and a customer.");
            }

            const payload = {
                invoice_number: window.currentInvNum,
                customer: document.getElementById('custSelect').value,
                employee: currentUser,
                item_details: `${itemText} | Size: ${finalSize} | Qty: ${document.getElementById('qty').value}`,
                subtotal: document.getElementById('price').value,
                tax: document.getElementById('tax').value,
                total: document.getElementById('totalDisplay').innerText.replace('$','')
            };

            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            alert("Sale Saved to Spreadsheet!");
            closeModal();
            loadInvoices();
        }

        function closeModal() { document.getElementById('invoiceModal').style.display = 'none'; }
        
        async function loadInventory() {
            setActiveTab('t-inv');
            const res = await fetch(`${SCRIPT_URL}?action=getInventory`);
            const data = await res.json();
            let h = `<div class="card"><h3>Product Inventory</h3><table><tr><th>SKU</th><th>Item</th><th>Price</th><th>Tax Exempt</th></tr>`;
            data.forEach(i => h += `<tr><td>${i.sku_barcode}</td><td>${i.item_name}</td><td>$${i.price}</td><td>${i.tax_exempt ? 'Yes' : 'No'}</td></tr>`);
            document.getElementById('pageContent').innerHTML = h + `</table></div>`;
        }

        async function loadInvoices() {
            setActiveTab('t-sales');
            const res = await fetch(`${SCRIPT_URL}?action=getInvoices`);
            const data = await res.json();
            let h = `<div class="card"><div style="display:flex; justify-content:space-between; align-items:center;"><h3>Sales History</h3><button class="btn-primary" style="width:auto; padding:8px 25px;" onclick="openModal()">+ New Sale</button></div><table><tr><th>Inv #</th><th>Customer</th><th>Total</th><th>Status</th></tr>`;
            data.reverse().forEach(i => h += `<tr><td><b>${i.invoice_number}</b></td><td>${i.customer}</td><td>$${i.total}</td><td><span class="badge-paid">Paid</span></td></tr>`);
            document.getElementById('pageContent').innerHTML = h + `</table></div>`;
        }
        
        function showDashboard() {
            setActiveTab('t-dash');
            document.getElementById('pageContent').innerHTML = `<div class="card"><h3>Manager Dashboard</h3><p>Logged in as: <b>${currentUser}</b></p><p style="margin-top:10px; color:#64748b;">Use the tabs above to manage your inventory or process new sales.</p></div>`;
        }

        function setActiveTab(id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
