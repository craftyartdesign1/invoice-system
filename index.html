<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD | NYC POS SYSTEM</title>
    <style>
        :root { --blue: #004080; --dark: #333; --light: #f4f7f6; --red: #e74c3c; --green: #28a745; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-color, var(--light)); background-size: cover; margin: 0; min-height: 100vh; }
        
        .header-section { background: rgba(255,255,255,0.9); padding: 15px 30px; border-bottom: 4px solid var(--blue); display: flex; justify-content: space-between; align-items: center; }
        #logo-container img { max-height: 60px; }
        
        .nav-bar { display: flex; background: var(--dark); padding: 10px; gap: 10px; }
        .tab { padding: 12px 20px; color: white; border: none; background: #555; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .tab.active { background: var(--blue); border-bottom: 3px solid #ffd700; }

        .content { padding: 20px; max-width: 1400px; margin: auto; }
        .card { background: rgba(255,255,255,0.95); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }

        .pos-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .pos-table th { background: #f1f5f9; padding: 12px; text-align: left; border-bottom: 2px solid #ddd; }
        .pos-table td { padding: 12px; border-bottom: 1px solid #eee; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; }
        .btn-green { background: var(--green); }
        .btn-blue { background: #2563eb; }
        .btn-red { background: var(--red); }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 100%; }
        input:disabled { background-color: #f0f0f0; color: #888; cursor: not-allowed; }

        .total-display { text-align: right; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .grand-total { font-size: 2rem; font-weight: bold; color: var(--blue); }

        .admin-section { border-bottom: 1px solid #eee; padding: 20px 0; }
        @media print { .nav-bar, .header-section, .btn-no-print, .action-col { display: none !important; } }
    </style>
</head>
<body>

<div class="header-section">
    <div id="logo-container">
        <h2 id="text-logo" style="margin:0;">CRAFTY ART DESIGN</h2>
    </div>
    <div style="text-align: right;">
        <strong>User: <span id="displayUser">Alessio</span></strong><br>
        <button class="btn btn-blue btn-sm btn-no-print" onclick="toggleRole()" style="margin-top:5px; background:#666;">🛠️ Switch Role</button>
    </div>
</div>

<nav class="nav-bar">
    <button class="tab active" onclick="loadTab('Generator')">Invoice Generator</button>
    <button class="tab" onclick="loadTab('Lookup')">Invoice Lookup</button>
    <button class="tab" onclick="loadTab('Inventory')">Inventory</button>
    <button class="tab" onclick="loadTab('Customers')">Customers</button>
    <button id="adminTab" class="tab" onclick="loadTab('Settings')">⚙️ Admin Settings</button>
</nav>

<div class="content" id="mainView"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxNDPBFyPktfE46fGJg8PhZSH9q7_LBDDJDZ-SLyjo5Pd27PQxKyVCoARhZCoyr0MCc/exec";
    let inventory = [];
    let customers = [];
    let managerPin = "1234";
    let currentUser = { name: 'Alessio', role: 'Admin' };
    let users = [{user: "Alessio", role: "Admin"}, {user: "Staff", role: "Staff"}];

    window.onload = async () => {
        await refreshData();
        loadTab('Generator');
    };

    function toggleRole() {
        currentUser = (currentUser.role === 'Admin') ? users[1] : users[0];
        document.getElementById('displayUser').innerText = currentUser.name;
        document.getElementById('adminTab').style.display = (currentUser.role === 'Admin') ? 'block' : 'none';
        loadTab('Generator');
    }

    async function refreshData() {
        try {
            const [iRes, cRes] = await Promise.all([
                fetch(`${SCRIPT_URL}?action=getInventory`),
                fetch(`${SCRIPT_URL}?action=getCustomers`)
            ]);
            inventory = await iRes.json();
            customers = await cRes.json();
        } catch(e) { console.error("Data load failed"); }
    }

    function loadTab(tabName) {
        const view = document.getElementById('mainView');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        
        if (tabName === 'Generator') {
            renderGenerator(view);
        } else if (tabName === 'Inventory' || tabName === 'Customers') {
            renderDataList(tabName, view);
        } else if (tabName === 'Settings') {
            renderAdminSettings(view);
        } else if (tabName === 'Lookup') {
            view.innerHTML = `<div class="card"><h3>Invoice History</h3><table class="pos-table"><thead><tr><th>Inv #</th><th>Date</th><th>Customer</th><th>Total</th></tr></thead><tbody id="lookupBody"></tbody></table></div>`;
        }
    }

    function renderGenerator(view) {
        const isAdmin = currentUser.role === 'Admin';
        view.innerHTML = `
            <div class="card">
                <h3>Invoice Generator</h3>
                <select id="posCustomer" style="margin-bottom:15px;"><option value="">Select Customer...</option>${customers.map(c=>`<option>${c.Name}</option>`).join('')}</select>
                <table class="pos-table">
                    <thead><tr><th>SKU</th><th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead>
                    <tbody id="posBody"></tbody>
                </table>
                <button class="btn btn-blue btn-sm btn-no-print" onclick="addRow()" style="margin-top:10px;">+ Add Item</button>
                <div class="total-display">
                    <div class="grand-total">Total: <span id="grandDisp">$0.00</span></div>
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn btn-green btn-no-print" style="flex:1;" onclick="window.print()">PRINT</button>
                    <button class="btn btn-blue btn-no-print" style="flex:1;" onclick="alert('Saved')">SAVE</button>
                </div>
            </div>`;
        addRow();
    }

    function addRow() {
        const isAdmin = currentUser.role === 'Admin';
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" onchange="autoFill(this)"></td>
            <td><input type="text" ${!isAdmin ? 'disabled' : ''}></td>
            <td><input type="number" value="1" oninput="calcTotal()"></td>
            <td><input type="text" ${!isAdmin ? 'disabled' : ''} oninput="calcTotal()"></td>
            <td class="row-total">$0.00</td>
            <td><button class="btn btn-red btn-sm" onclick="this.parentElement.parentElement.remove(); calcTotal();">X</button></td>
        `;
        document.getElementById('posBody').appendChild(tr);
    }

    function autoFill(input) {
        const item = inventory.find(i => String(i.SKU).toLowerCase() === input.value.toLowerCase());
        if(item) {
            const tr = input.closest('tr');
            tr.cells[1].children[0].value = item["Item Name"];
            tr.cells[3].children[0].value = item.Price;
            calcTotal();
        }
    }

    function calcTotal() {
        let total = 0;
        document.querySelectorAll('#posBody tr').forEach(tr => {
            const q = tr.cells[2].children[0].value;
            const p = tr.cells[3].children[0].value;
            const row = q * p;
            tr.cells[4].innerText = "$" + row.toFixed(2);
            total += row;
        });
        document.getElementById('grandDisp').innerText = "$" + (total * 1.08875).toFixed(2);
    }

    function renderDataList(type, view) {
        const isAdmin = currentUser.role === 'Admin';
        let rows = (type === 'Inventory' ? inventory : customers).map(r => `
            <tr>
                <td>${type === 'Inventory' ? r.SKU : r.Name}</td>
                <td>${type === 'Inventory' ? r["Item Name"] : r["Street Address"]}</td>
                <td class="action-col">
                    ${isAdmin ? `<button class="btn btn-blue btn-sm">Edit</button> <button class="btn btn-red btn-sm">Delete</button>` : `<span style="color:#888;">View Only</span>`}
                </td>
            </tr>
        `).join('');
        view.innerHTML = `<div class="card"><h3>${type}</h3><table class="pos-table"><thead><tr><th>Key</th><th>Details</th><th class="action-col">Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function renderAdminSettings(view) {
        view.innerHTML = `
            <div class="card">
                <div class="admin-section">
                    <h3>Branding (Logo & Background)</h3>
                    <label>Upload Logo:</label> <input type="file" accept="image/*" onchange="updateLogo(this)"><br><br>
                    <label>Background Image:</label> <input type="file" accept="image/*" onchange="updateBg(this)">
                    <button class="btn btn-sm btn-red" onclick="document.body.style.backgroundImage='';">Clear Background</button>
                </div>
                <div class="admin-section">
                    <h3>Security</h3>
                    <label>Manager Override PIN:</label>
                    <input type="password" id="newPin" value="${managerPin}">
                    <button class="btn btn-blue btn-sm" onclick="managerPin = document.getElementById('newPin').value; alert('PIN Saved')">Update PIN</button>
                </div>
                <div class="admin-section">
                    <h3>User Management</h3>
                    <table class="pos-table">
                        <thead><tr><th>User</th><th>Role</th><th>Action</th></tr></thead>
                        <tbody>${users.map(u=>`<tr><td>${u.name}</td><td>${u.role}</td><td><button class="btn btn-red btn-sm">Delete</button></td></tr>`).join('')}</tbody>
                    </table>
                    <button class="btn btn-blue btn-sm" style="margin-top:10px;">+ Create New User</button>
                </div>
            </div>`;
    }

    function updateLogo(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('logo-container').innerHTML = `<img src="${e.target.result}">`;
        };
        reader.readAsDataURL(input.files[0]);
    }

    function updateBg(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            document.body.style.backgroundImage = `url('${e.target.result}')`;
        };
        reader.readAsDataURL(input.files[0]);
    }
</script>
</body>
</html>
