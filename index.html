<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>CraftyArt Portal</title>
    <style>
        :root { --primary: #1e3a8a; --secondary: #3b82f6; --success: #10b981; --bg: #f8fafc; --text: #1e293b; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .header-top { background: #fff; padding: 1.2rem 2.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-box { width: 50px; height: 50px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 1.4rem; }
        .tabs { background: #fff; display: flex; padding: 0 2.5rem; border-bottom: 1px solid #e2e8f0; gap: 10px; overflow-x: auto; }
        .tab { padding: 1.2rem 1.8rem; border: none; background: none; cursor: pointer; font-weight: 600; color: #64748b; border-bottom: 4px solid transparent; transition: 0.3s; white-space: nowrap; }
        .tab.active { color: var(--secondary); border-bottom-color: var(--secondary); background: #f0f7ff; }
        .content { padding: 2.5rem; max-width: 1300px; margin: 0 auto; }
        .card { background: #fff; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        
        /* THE CRITICAL FIX FOR YOUR SCREENSHOT ERROR */
        .app-hidden { display: none !important; }
        
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 0.6rem; font-weight: 700; color: #475569; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 0.85rem; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 1rem; }
        .btn { padding: 1rem 2rem; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; transition: 0.2s; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-blue { background: var(--secondary); color: #fff; width: 100%; }
        .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--primary); }
        .login-box { background: #fff; padding: 3.5rem; border-radius: 24px; width: 420px; text-align: center; }
    </style>
</head>
<body>

<div id='loginScreen' class='login-screen'>
    <div class='login-box'>
        <h1 style='color: var(--primary); margin-bottom: 2rem;'>CraftyArt Portal</h1>
        <div class='form-group' style='text-align:left; margin-bottom:1.5rem'>
            <label>Username</label>
            <input type='text' id='username' placeholder='Owner'>
        </div>
        <div class='form-group' style='text-align:left; margin-bottom:2rem'>
            <label>Password</label>
            <input type='password' id='password' placeholder='••••••••'>
        </div>
        <button class='btn btn-blue' onclick='login()'>Sign In</button>
    </div>
</div>

<div id='mainApp' class='app-hidden'>
    <div class='header-top'>
        <div class='logo-area'><div class='logo-box'>CA</div><h1>CraftyArt Design</h1></div>
        <button class='btn' style='background:#ef4444; color:white;' onclick='location.reload()'>Logout</button>
    </div>
    
    <div class='tabs'>
        <button class='tab active' onclick="showTab('invoice',event)">Invoices</button>
        <button class='tab' onclick="showTab('inventory',event)">Inventory</button>
        <button class='tab' onclick="showTab('customers',event)">Customers</button>
    </div>

    <div class='content'>
        <div id='invoice' class='card'>
            <h2>📄 Invoice Center</h2>
            <p>Database: Connected ✅</p>
        </div>
        <div id='inventory' class='card app-hidden'>
            <h2>📦 Inventory</h2>
        </div>
        <div id='customers' class='card app-hidden'>
            <h2>👥 Customers</h2>
        </div>
    </div>
</div>

<script>
// Your verified URL
const URL = 'https://script.google.com/macros/s/AKfycbz6tucuZ0HMChNlSq8wu14vD8VxX4ldV2KLAaE2GDW7zPHEvNCq5pLzHvkR545Gt3M/exec';

function login() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    
    // Exact match for your sheet
    if (u === 'Owner' && p === 'Craftyowner123') {
        document.getElementById('loginScreen').classList.add('app-hidden');
        document.getElementById('mainApp').classList.remove('app-hidden');
    } else { 
        alert('Try: Owner / Craftyowner123'); 
    }
}

function showTab(id, e) {
    document.querySelectorAll('.card').forEach(function(c) { c.classList.add('app-hidden'); });
    document.getElementById(id).classList.remove('app-hidden');
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    e.target.classList.add('active');
}
</script>
</body>
</html>
