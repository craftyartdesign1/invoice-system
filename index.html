<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftyArt Management System</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f7f9;color:#333}
        .header-top{background:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e0e6ed}
        .tabs{background:#fff;display:flex;padding:0 2rem;border-bottom:1px solid #e0e6ed;overflow-x:auto}
        .tab{padding:1rem 1.25rem;border:none;background:none;cursor:pointer;font-weight:500;color:#64748b;border-bottom:3px solid transparent;white-space:nowrap}
        .tab.active{color:#3b82f6;border-bottom-color:#3b82f6}
        .content{padding:2rem;max-width:1200px;margin:0 auto}
        .card{background:#fff;padding:1.5rem;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,0.05);margin-bottom:2rem}
        .hidden{display:none}
        .form-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:1rem;margin-bottom:1rem}
        .form-group label{display:block;font-size:0.8rem;margin-bottom:0.4rem;font-weight:600;color:#475569}
        .form-group input{width:100%;padding:0.6rem;border:1px solid #cbd5e1;border-radius:6px;font-size:0.9rem}
        .btn{padding:0.6rem 1.2rem;border-radius:6px;border:none;cursor:pointer;font-weight:600;transition:0.2s}
        .btn-blue{background:#3b82f6;color:#fff}
        .btn-red{background:#ef4444;color:#fff}
        .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#3b82f6}
        .login-box{background:#fff;padding:2.5rem;border-radius:12px;width:380px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.1)}
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h2 style="margin-bottom:1.5rem; color:#1e3a8a">System Login</h2>
        <input type="text" id="username" placeholder="Username" style="width:100%;padding:0.8rem;margin-bottom:1rem;border:1px solid #ddd;border-radius:6px">
        <input type="password" id="password" placeholder="Password" style="width:100%;padding:0.8rem;margin-bottom:1.5rem;border:1px solid #ddd;border-radius:6px">
        <div id="loginError" style="color:red;margin-bottom:1rem;font-size:0.85rem;min-height:1.2rem"></div>
        <button class="btn btn-blue" style="width:100%" type="button" onclick="login()">Sign In</button>
    </div>
</div>

<div id="mainApp" class="hidden">
    <div class="header-top">
        <h1 style="color:#1e3a8a">CraftyArt Design</h1>
        <button class="btn btn-red" onclick="location.reload()">Logout</button>
    </div>
    
    <div class="tabs">
        <button class="tab active" onclick="showTab('inventory',event)">Inventory</button>
        <button class="tab" onclick="showTab('customers',event)">Customers</button>
        <button class="tab" onclick="showTab('admin',event)">Admin</button>
    </div>

    <div class="content">
        <div id="inventory" class="card">
            <h2>Inventory Management</h2>
            <div class="form-grid">
                <div class="form-group"><label>SKU</label><input type="text" id="invSKU"></div>
                <div class="form-group"><label>Item Name</label><input type="text" id="invItem"></div>
                <div class="form-group"><label>Price ($)</label><input type="number" id="invPrice"></div>
            </div>
            <button class="btn btn-blue" onclick="saveToSheet('Inventory')">Add Item</button>
        </div>

        <div id="customers" class="card hidden">
            <h2>Customer Database</h2>
            <div class="form-grid">
                <div class="form-group"><label>Name</label><input type="text" id="custName"></div>
                <div class="form-group"><label>Email</label><input type="email" id="custEmail"></div>
            </div>
            <button class="btn btn-blue" onclick="saveToSheet('Customers')">Add Customer</button>
        </div>

        <div id="admin" class="card hidden">
            <h2>Admin Panel</h2>
            <p>System is connected to Google Sheets.</p>
        </div>
    </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwD-PR1pNnLvbqS7Cp0Mas9w39FrPFYMln6Dx8I3N4pe2ceovn48CZK26D9L0D6cqc/exec';

function login() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    const err = document.getElementById('loginError');

    // Simple, direct check
    if (u === "Owner" && p === "Craftyowner123") {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').classList.remove('hidden');
    } else {
        err.innerText = "Invalid credentials. Use Owner / Craftyowner123";
    }
}

function showTab(id, e) {
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if(e && e.target) e.target.classList.add('active');
}

async function saveToSheet(name) {
    let data = [];
    if(name === 'Inventory') {
        data = [document.getElementById('invSKU').value, document.getElementById('invItem').value, document.getElementById('invPrice').value];
    } else {
        data = [document.getElementById('custName').value, document.getElementById('custEmail').value];
    }

    try {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ sheet: name, data: data })
        });
        alert('Saved!');
    } catch (e) {
        alert('Error');
    }
}
</script>
</body>
</html>
