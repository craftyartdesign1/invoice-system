<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFTY ART DESIGN | POS SYSTEM</title>
    <style>
        :root { --blue: #004d73; --bg: #f1f5f9; --white: #ffffff; --green: #10b981; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        #loginOverlay { background: var(--white); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        h1 { color: var(--blue); margin-bottom: 25px; font-size: 1.5rem; }
        
        input { padding: 12px; border: 1px solid #ddd; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 15px; font-size: 1rem; }
        
        .btn { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: var(--blue); color: white; width: 100%; font-size: 1rem; transition: 0.3s; }
        .btn:hover { background: #003a57; }
        
        #mainContent { display: none; text-align: center; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .success-icon { font-size: 3rem; color: var(--green); margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <h1>CRAFTY ART DESIGN</h1>
    <input type="text" id="userIn" placeholder="Username">
    <input type="password" id="passIn" placeholder="Password">
    <button class="btn" id="loginBtn" onclick="attemptLogin()">Login to POS</button>
</div>

<div id="mainContent">
    <div class="success-icon">✔</div>
    <h2>System Connected</h2>
    <p>Welcome back, <span id="userGreeting" style="font-weight:bold; color:var(--blue);"></span>!</p>
    <p style="color: #666; font-size: 0.9rem;">The connection to your Google Sheet is active.</p>
    <button class="btn" style="margin-top: 20px; background: #64748b;" onclick="location.reload()">Logout</button>
</div>

<script>
    // YOUR NEW UPDATED URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytUgh1lSjvMDMPYUv_OGuDHv0V9Z8haFMla4quAsU9ghf7YhCzrwL-w-7gyO6OTc3P/exec";

    async function attemptLogin() {
        const u = document.getElementById('userIn').value;
        const p = document.getElementById('passIn').value;
        const btn = document.getElementById('loginBtn');

        if (!u || !p) {
            alert("Please enter both username and password.");
            return;
        }

        btn.innerText = "Connecting...";
        btn.disabled = true;

        try {
            // Sending login request to Google Script
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ 
                    action: "login", 
                    username: u, 
                    password: p 
                })
            });

            const data = await response.json();

            if (data.success) {
                // Hide login, show success
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('userGreeting').innerText = data.displayName;
            } else {
                alert("Invalid Username or Password. Please check your 'Admin' sheet.");
                btn.innerText = "Login to POS";
                btn.disabled = false;
            }
        } catch (error) {
            console.error("Connection Error:", error);
            alert("Connection Failed. Did you remember to deploy the Google Script as 'Anyone'?");
            btn.innerText = "Login to POS";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
