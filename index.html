<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Invoice System</title>
    <style>
        body{font-family:sans-serif;background:#f3f4f6;display:flex;justify-content:center;padding-top:50px}
        .box{background:#fff;padding:40px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,0.1);width:300px;text-align:center}
        input{width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:5px}
        button{width:100%;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:5px;cursor:pointer}
        .hidden{display:none}
    </style>
</head>
<body>
    <div id="loginScreen" class="box">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <div id="err" style="color:red;font-size:12px"></div>
        <button onclick="login()">Login</button>
    </div>
    <div id="mainApp" class="box hidden">
        <h2 style="color:green">Success!</h2>
        <p>Connected to Cloud ☁️</p>
    </div>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxDdhbjx9JdSjGy7LySxWEhInQ6dsnYrZPadpXBDFS3gXJStDDIkh3abv7fUCsiEQbK/exec';
async function login(){
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const e = document.getElementById('err');
    try {
        const res = await fetch(`${SCRIPT_URL}?action=login&username=${u}&password=${p}`);
        const data = await res.json();
        if(data.success){
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
        } else { e.textContent = "Wrong login details"; }
    } catch(err) { e.textContent = "Connection Error"; }
}
</script>
</body>
</html>
