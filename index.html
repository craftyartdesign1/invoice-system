<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crafty Art Design – Login</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f3f4f6;
}
.login{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#667eea,#764ba2);
}
.login-box{
  background:white;
  padding:2rem;
  width:100%;
  max-width:360px;
  border-radius:8px;
  text-align:center;
}
.login-box h2{
  margin-bottom:1rem;
}
input{
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:16px;
}
button{
  width:100%;
  padding:12px;
  background:#2563eb;
  color:white;
  border:none;
  font-size:16px;
  border-radius:4px;
}
.error{
  color:#ef4444;
  margin-top:10px;
}
.hidden{
  display:none;
}
.header{
  padding:1rem;
  background:white;
  display:flex;
  justify-content:space-between;
}
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="login" class="login">
  <div class="login-box">
    <h2>Crafty Art Design</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="msg" class="error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app" class="hidden">
  <div class="header">
    <strong>Invoice Dashboard</strong>
    <button onclick="logout()">Logout</button>
  </div>
  <div style="padding:1rem">
    ✅ Login successful<br><br>
    Step 3 complete. Next: Google Sheets connection.
  </div>
</div>

<script>
function login(){
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  if(u === "admin" && p === "admin123"){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  }else{
    document.getElementById("msg").innerText = "Invalid login";
  }
}

function logout(){
  location.reload();
}
</script>

</body>
</html>
