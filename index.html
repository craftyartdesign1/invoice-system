<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftyArt Design System</title>
    <style>
        :root { --primary: #1e3a8a; --secondary: #3b82f6; --success: #10b981; --bg: #f8fafc; --text: #1e293b; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .header-top { background: #fff; padding: 1.2rem 2.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-box { width: 50px; height: 50px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 1.4rem; }
        .tabs { background: #fff; display: flex; padding: 0 2.5rem; border-bottom: 1px solid #e2e8f0; gap: 10px; overflow-x: auto; }
        .tab { padding: 1.2rem 1.8rem; border: none; background: none; cursor: pointer; font-weight: 600; color: #64748b; border-bottom: 4px solid transparent; transition: 0.3s; white-space: nowrap; }
        .tab.active { color: var(--secondary); border-bottom-color: var(--secondary); background: #f0f7ff; }
        .content { padding: 2.5rem; max-width: 1300px; margin: 0 auto; }
        .card { background: #fff; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .hidden { display: none; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.8rem; margin-bottom: 2rem; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 0.6rem; font-weight: 700; color: #475569; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 0.85rem; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 1rem; }
        .form-group input[readonly] { background: #f8fafc; cursor: not-allowed; border-style: dashed; }
        .btn { padding: 1rem 2rem; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; transition: 0.2s; font-size: 1rem; display: inline-flex; align-items: center; gap: 10px; }
        .btn-blue { background: var(--secondary); color: #fff; }
        .btn-green { background: var(--success); color: #fff; width: 100%; justify-content: center; }
        .btn-red { background: #ef4444; color: #fff; }
        .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--primary); }
        .login-box { background: #fff; padding: 3.5rem; border-radius: 24px; width: 420px; text-align: center; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h1 style="color: var(--primary); margin-bottom: 2rem;">CraftyArt Portal</h1>
        <div class="form-group" style="text-align:left; margin-bottom:1.5rem">
            <label>Username</label>
            <input type="text" id="username" placeholder="Owner">
        </div>
        <div class="form-group" style="text-align:left; margin-bottom:2rem">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn btn-blue" style="width:100%; justify-content:center" onclick="login()">Sign In</button>
    </div>
</div>

<div id="mainApp" class="hidden">
    <div class="header-top">
        <div class="logo-area"><div class="logo-box">CA</div><h1>CraftyArt Design</h1></div>
        <button class="btn btn-red" onclick="location.reload()">Logout</button>
    </div>
    
    <div class="tabs">
        <button class="tab active" onclick="showTab('invoice',event)">Invoices</button>
        <button class="tab" onclick="showTab('inventory',event)">Inventory</button>
        <button class="tab" onclick="showTab('customers',event)">Customers</button>
        <button class="tab" onclick="showTab('admin',event)">Admin</button>
    </div>

    <div class="content">
        <div id="invoice" class="card">
            <h2>📄 Generate Invoice</h2>
            <div class="form-grid">
                <div class="form-group"><label>Invoice #</label><input type="text" id="invNum" value="INV-101"></div>
                <div class="form-group"><label>Customer Name</label><input type="text" id="invCust"></div>
                <div class="form-group"><label>Date</label><input type="date" id="invDate"></div>
            </div>
            <div class="form-grid">
                <div class="form-group" style="grid-column: span 2;"><label>Description</label><input type="text" id="invDesc"></div>
                <div class="form-group"><label>Qty</label><input type="number" id="invQty" value="1" oninput="calcInv()"></div>
                <div class="form-group"><label>Price ($)</label><input type="number" id="invPrice" oninput="calcInv()"></div>
                <div class="form-group"><label>Total ($)</label><input type="text" id="invTotal" readonly value="0.00"></div>
            </div>
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
                <input type="checkbox" id="invTax" style="width:20px; height:20px;">
                <label style="font-weight:bold; font-size:0.9rem;">TAX EXEMPT</label>
            </div>
            <button class="btn btn-green" onclick="save('Invoices')">Log Invoice to Sheet</button>
        </div>

        <div id="inventory" class="card hidden">
            <h2>📦 Inventory Management</h2>
            <div class="form-grid">
                <div class="form-group"><label>SKU</label><input type="text" id="stSKU"></div>
                <div class="form-group"><label>Product Name</label><input type="text" id="stProd"></div>
                <div class="form-group"><label>Size</label><input type="text" id="stSize"></div>
                <div class="form-group"><label>Type</label>
                    <select id="stType">
                        <option>Material</option>
                        <option>Apparel</option>
                        <option>Finished Good</option>
                    </select>
                </div>
                <div class="form-group"><label>Cost ($)</label><input type="number" id="stCost"></div>
            </div>
            <button class="btn btn-blue" onclick="save('Inventory')">Add Product</button>
        </div>

        <div id="customers" class="card hidden">
            <h2>👥 Customer Registry</h2>
            <div class="form-grid">
                <div class="form-group"><label>Full Name</label><input type="text" id="cName"></div>
                <div class="form-group"><label>Company</label><input type="text" id="cComp"></div>
                <div class="form-group"><label>Email</label><input type="email" id="cEmail"></div>
                <div class="form-group"><label>Phone</label><input type="text" id="cPhone"></div>
                <div class="form-group" style="grid-column: span 2;"><label>Address</label><input type="text" id="cAddr"></div>
            </div>
            <button class="btn btn-blue" onclick="save('Customers')">Save Customer</button>
        </div>

        <div id="admin" class="card hidden">
            <h2>⚙️ System Info</h2>
            <p>Database Connected: <b>Yes</b></p>
            <p>User: <b>Owner</b></p>
        </div>
    </div>
</div>

<script>
// This matches your deployment URL
const URL = 'https://script.google.com/macros/s/AKfycbz6tucuZ0HMChNlSq8wu14vD8VxX4ldV2KLAaE2GDW7zPHEvNCq5pLzHvkR545Gt3M/exec';
function login() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    
    // Exact match for your Users tab
    if(u === "Owner" && p === "Craftyowner123") {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
    } else { alert("Invalid Credentials"); }
}

function showTab(id, e) {
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
}

function calcInv() {
    const q = document.getElementById('invQty').value || 0;
    const p = document.getElementById('invPrice').value || 0;
    document.getElementById('invTotal').value = (q * p).toFixed(2);
}

async function save(tabName) {
    let data = [];
    if(tabName === 'Invoices') {
        data = [
            document.getElementById('invNum').value, 
            document.getElementById('invCust').value, 
            document.getElementById('invDate').value, 
            document.getElementById('invDesc').value, 
            document.getElementById('invQty').value, 
            document.getElementById('invPrice').value, 
            document.getElementById('invTotal').value, 
            document.getElementById('invTax').checked ? "YES" : "NO"
        ];
    } else if(tabName === 'Inventory') {
        data = [
            document.getElementById('stSKU').value, 
            document.getElementById('stProd').value, 
            document.getElementById('stSize').value, 
            document.getElementById('stType').value, 
            document.getElementById('stCost').value
        ];
    } else if(tabName === 'Customers') {
        data = [
            document.getElementById('cName').value, 
            document.getElementById('cComp').value, 
            document.getElementById('cEmail').value, 
            document.getElementById('cPhone').value, 
            document.getElementById('cAddr').value
        ];
    }

    try {
        await fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ sheet: tabName, data: data }) });
        alert("Synced successfully with " + tabName);
        location.reload();
    } catch (e) { alert("Connectivity Error"); }
}
</script>
</body>
</html>
