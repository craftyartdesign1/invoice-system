<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafty Art Design | Management System</title>
    <style>
        :root { --primary: #000000; --bg: #f3f4f6; --white: #ffffff; --text: #1f2937; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        
        #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        #mainApp { display: none; }

        .login-box { background: var(--white); width: 90%; max-width: 400px; padding: 2.5rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        header { background: var(--white); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-tabs { display: flex; background: #e5e7eb; padding: 10px 20px; gap: 10px; }
        .tab-btn { padding: 8px 15px; cursor: pointer; border: none; background: #f3f4f6; border-radius: 5px; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        .content-area { padding: 1.5rem; max-width: 1400px; margin: 0 auto; overflow-x: auto; }
        .card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        th { background: #f8fafc; text-align: left; padding: 10px; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        
        input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 8px; }
        .btn-primary { width: 100%; padding: 0.8rem; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h1>Crafty Art Design</h1>
            <p style="color: #666; margin-bottom: 1.5rem;">Management Portal</p>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class="btn-primary" onclick="handleLogin()">Sign In</button>
        </div>
    </div>

    <div id="mainApp">
        <header>
            <h2>Crafty Art Design</h2>
            <div>Welcome, <span id="userDisplay" style="font-weight: bold;">User</span> | <a href="#" onclick="location.reload()">Logout</a></div>
        </header>

        <nav class="nav-tabs">
            <button class="tab-btn" onclick="showDashboard()">Dashboard</button>
            <button class="tab-btn" onclick="loadInventory()">Inventory</button>
            <button class="tab-btn active" onclick="loadInvoices()">Invoices</button>
        </nav>

        <div class="content-area" id="pageContent"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFBf_VR0rtqHUuMDpqYZ5lXc_flDvS6VhQ10zZ5aU4BFlfuEIYdNPhEjWbAmOob0Na/exec";

        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            try {
                const response = await fetch(`${SCRIPT_URL}?action=login&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
                const data = await response.json();
                if (data.success) {
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                    document.getElementById('userDisplay').innerText = data.user.display_name;
                    showDashboard();
                } else { alert("Invalid Login"); }
            } catch (e) { alert("Connection Error"); }
        }

        function showDashboard() {
            updateTabs(0);
            document.getElementById('pageContent').innerHTML = `<div class="card"><h3>Dashboard</h3><p>System Connected.</p></div>`;
        }

        async function loadInventory() {
            updateTabs(1);
            const container = document.getElementById('pageContent');
            container.innerHTML = '<div class="card"><h3>Loading Inventory...</h3></div>';
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getInventory`);
                const data = await response.json();
                let html = `<div class="card"><h3>Inventory</h3><table><thead><tr><th>SKU</th><th>Item Name</th><th>Price</th><th>Size</th></tr></thead><tbody>`;
                data.forEach(item => {
                    html += `<tr><td>${item.sku||''}</td><td>${item.item_name||''}</td><td>$${item.price||''}</td><td>${item.size||''}</td></tr>`;
                });
                container.innerHTML = html + `</tbody></table></div>`;
            } catch (e) { container.innerHTML = "Error loading inventory."; }
        }

        async function loadInvoices() {
            updateTabs(2);
            const container = document.getElementById('pageContent');
            container.innerHTML = '<div class="card"><h3>Loading Invoices...</h3></div>';
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getInvoices`);
                const data = await response.json();
                let html = `
                    <div class="card">
                        <h3>Invoices</h3>
                        <div style="overflow-x:auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Inv #</th>
                                    <th>Date</th>
                                    <th>Customer</th>
                                    <th>Company</th>
                                    <th>Employee</th>
                                    <th>Subtotal</th>
                                    <th>Tax</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody>`;
                data.forEach(inv => {
                    html += `
                        <tr>
                            <td>${inv.invoice_number || ''}</td>
                            <td>${inv.date ? new Date(inv.date).toLocaleDateString() : ''}</td>
                            <td>${inv.customer || ''}</td>
                            <td>${inv.company || ''}</td>
                            <td>${inv.employee || ''}</td>
                            <td>$${inv.subtotal || '0.00'}</td>
                            <td>$${inv.tax || '0.00'}</td>
                            <td><strong>$${inv.total || '0.00'}</strong></td>
                        </tr>`;
                });
                container.innerHTML = html + `</tbody></table></div></div>`;
            } catch (e) { container.innerHTML = "Error loading invoices."; }
        }

        function updateTabs(index) {
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach((btn, i) => i === index ? btn.classList.add('active') : btn.classList.remove('active'));
        }
    </script>
</body>
</html>
