<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Admin | Pro Secure Portal</title>
    <style>
        :root { 
            --primary-blue: #007bff; 
            --danger-red: #dc3545; 
            --bg-light: #f8f9fa; 
            --dark-grey: #343a40;
            --border: #dee2e6;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #e9ecef; margin: 0; color: #333; }
        
        /* Login Screen */
        #loginOverlay { position: fixed; inset: 0; background: var(--dark-grey); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-box { background: white; padding: 40px; border-radius: 15px; width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-box h2 { color: var(--primary-blue); margin-bottom: 20px; letter-spacing: 1px; }

        /* Dashboard Layout */
        #dashboard { display: none; }
        header { background: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary-blue); }
        .nav-tabs { display: flex; background: var(--dark-grey); padding: 10px 20px; gap: 10px; }
        .tab-btn { padding: 10px 25px; border: none; background: #495057; color: white; border-radius: 5px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .tab-btn:hover { background: #6c757d; }
        .tab-btn.active { background: var(--primary-blue); }

        .content { padding: 2rem; max-width: 1600px; margin: auto; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow-x: auto; }
        
        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; background: #e7f1ff; color: #004085; padding: 15px; font-size: 0.8rem; text-transform: uppercase; border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

        /* Buttons */
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn-blue { background: var(--primary-blue); }
        .btn-blue:hover { background: #0056b3; }
        .btn-red { background: var(--danger-red); }
        .btn-red:hover { background: #a71d2a; }
        .btn-add { float: right; margin-bottom: 15px; padding: 12px 25px; font-size: 1rem; }

        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ced4da; border-radius: 8px; }
        
        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
        .modal-body { background: white; padding: 2rem; border-radius: 15px; width: 550px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>CRAFTY ART DESIGN</h2>
        <p>Admin Login</p>
        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn btn-blue" style="width:100%; padding: 15px;" onclick="checkLogin()">LOGIN</button>
        <p id="errMsg" style="color:var(--danger-red); font-size:0.85rem; margin-top:15px;"></p>
    </div>
</div>

<div id="dashboard">
    <header>
        <h2>CRAFTY ART DESIGN</h2>
        <div id="welcomeUser" style="font-weight: bold; color: var(--primary-blue);"></div>
    </header>
    <nav class="nav-tabs">
        <button class="tab-btn" onclick="loadTab('Inventory')">INVENTORY</button>
        <button class="tab-btn active" onclick="loadTab('Customers')">CUSTOMERS</button>
        <button class="tab-btn" onclick="loadTab('Users')">USERS</button>
    </nav>
    <div class="content">
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="🔍 Search records..." style="margin-bottom:20px;">
        <div id="main"></div>
    </div>
</div>

<div id="m" class="modal">
    <div class="modal-body">
        <h3 id="mt" style="color: var(--primary-blue);"></h3>
        <div id="mf"></div>
        <button class="btn btn-blue" id="saveBtn" style="width:100%; margin-top:20px; padding:15px;" onclick="save()">SAVE TO SYSTEM</button>
        <button onclick="closeM()" style="width:100%; margin-top:10px; background:none; border:none; color:var(--danger-red); font-weight:bold; cursor:pointer;">CANCEL</button>
    </div>
</div>
